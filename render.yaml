# AgentRun Server on Render: one web service and one persistent disk, from the release's published image (no build).
# The token is generated once; read it in the service's Environment tab.
# Needs a paid Render instance (plan 1c-2g) and a 10 GB disk: a card on the workspace.
# Render gives the service no Docker, so its agents get file tools and web_fetch but no shell.
# Needs no model key: leave the key fields below blank. Once it's live, set your password with the token, then Continue
# with ChatGPT in the console (Settings → Model keys, or the first screen), then run your first agent. Codex and pi run
# on the plan; Claude Agent, OpenCode, Jev decisions and paid tools need their own keys, here or in the console.
# The sign-in is for the person who runs this server: don't share it or let others run agents on it.
services:
  - type: web
    name: agentrun-server
    runtime: image
    # The release's published image (ghcr, built by release.yml from the reviewed tag): a deploy pulls it.
    image:
      url: ghcr.io/parcha-ai/agentrun-server:v0.1.0-beta.60
    # 2 GB and a 10 GB disk at the least: Claude Code and Codex install themselves on first use onto the disk (the image
    # leaves them out), which fills 1 GB, and 512 MB is short for them.
    plan: 1c-2g
    numInstances: 1
    healthCheckPath: /v2/health
    # The image's default command: the server and one runner, two processes in this one service, on the one disk. If
    # either exits, the container exits non-zero and Render starts it again. Render waits 30 s after SIGTERM, above the
    # runner's 6 s drain. maxShutdownDelaySeconds would set it, but Render does not take it for a service with a
    # persistent disk, as this one is.
    disk:
      name: agentrun-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: PORT
        value: "7340"
      - key: AGENTRUN_TOKEN
        generateValue: true
      # No AGENTRUN_TRUSTED_PROXIES here: Render publishes no address for the proxy that reaches a service, and trusting
      # a whole private range would let any peer on the private network name its own address to the sign-in limit. Unset,
      # every visitor counts as the proxy, and the server-wide budget holds guessers to a minute's wait at most. To count
      # visitors one by one, add it in the service's Environment with the address in the log's
      # `event=forwarded_untrusted peer=<address>` line, which the owner's sign-in writes (a server from a release after
      # 0.1.0-beta.32; packages/serve/README.md, "Your password").
      # The key saved model and tool keys, MCP server credentials and webhook trigger secrets are sealed under. Render
      # generates it once (base64 of 256 bits); a service that already has it keeps its own. Losing it loses them.
      # Every runner must be given this same value.
      - key: AGENTRUN_SEAL_KEY
        generateValue: true
      # Render's platform hasn't been shown to keep the image helper's file capabilities, so runs run as the server's
      # user, each still a process of its own. Remove this variable to run each run as a user of its own once the
      # platform allows it.
      - key: AGENTRUN_RUN_USER
        value: same
      # Every model key is optional. To add one, the recommended key: OpenRouter covers every model, Jev included.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AGENT_MODEL
        sync: false
      - key: AGENT_MODEL_BASE_URL
        sync: false
      - key: AGENT_MODEL_API_KEY
        sync: false
