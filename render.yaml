# AgentRun Server on Render: one web service and one persistent disk, from the release's published image (no build).
# The token is generated once; read it in the service's Environment tab.
# Needs a paid Render instance (plan 1c-2g) and a 10 GB disk: a card on the workspace.
services:
  - type: web
    name: agentrun-server
    runtime: image
    # The release's published image (ghcr, built by release.yml from the reviewed tag): a deploy pulls it.
    image:
      url: ghcr.io/parcha-ai/agentrun-server:v0.1.0-beta.32
    # 2 GB and a 10 GB disk at the least: Claude Code and Codex install themselves on first use onto the disk (the image
    # leaves them out), which fills 1 GB, and 512 MB is short for them.
    plan: 1c-2g
    numInstances: 1
    healthCheckPath: /v2/health
    # Render waits 30 s after SIGTERM, above the image's 6 s drain. maxShutdownDelaySeconds would set it, but Render
    # does not take it for a service with a persistent disk, as this one is.
    disk:
      name: agentrun-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: PORT
        value: "7340"
      - key: AGENTRUN_TOKEN
        generateValue: true
      # No AGENTRUN_TRUSTED_PROXIES here: Render publishes no address for the proxy that reaches a service, and trusting
      # a whole private range would let any peer on the private network name its own address to the sign-in limit. Unset,
      # every visitor counts as the proxy, and the server-wide budget holds guessers to a minute's wait at most. To count
      # visitors one by one, add it in the service's Environment with the address in the log's first
      # `event=forwarded_untrusted peer=<address>` line (packages/serve/README.md, "Your password").
      # The key saved model and tool keys, MCP server credentials and webhook trigger secrets are sealed under. Render
      # generates it once (base64 of 256 bits); a service that already has it keeps its own. Losing it loses them.
      # Every runner must be given this same value.
      - key: AGENTRUN_SEAL_KEY
        generateValue: true
      # The recommended key: OpenRouter covers every model, Jev included.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AGENT_MODEL
        sync: false
      - key: AGENT_MODEL_BASE_URL
        sync: false
      - key: AGENT_MODEL_API_KEY
        sync: false
