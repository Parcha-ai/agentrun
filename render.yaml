# AgentRun Server on Render: one web service and one persistent disk, built from this repository's Dockerfile.
# The token is generated once; read it in the service's Environment tab.
services:
  - type: web
    name: agentrun-server
    runtime: docker
    dockerfilePath: ./packages/serve/docker/Dockerfile
    dockerContext: .
    plan: starter
    numInstances: 1
    healthCheckPath: /v2/health
    # Render waits 30 s after SIGTERM, above the image's 6 s drain. maxShutdownDelaySeconds would set it, but Render
    # does not take it for a service with a persistent disk, as this one is.
    disk:
      name: agentrun-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "7340"
      - key: AGENTRUN_TOKEN
        generateValue: true
      - key: AGENT_MODEL
        sync: false
      - key: AGENT_MODEL_BASE_URL
        sync: false
      - key: AGENT_MODEL_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Leave empty for the default image. 0.3.286 (the version the lock pins) builds the image with the Claude Agent SDK
      # and its CLI, so claude-agent runs: Render passes a Docker service's environment to the build as build args.
      - key: CLAUDE_AGENT_SDK
        sync: false
