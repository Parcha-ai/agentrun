<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent in a tab</title>
<style>
:root {
  --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a65; --line: #e2e0d8;
  --tab: #1f7a4d; --tab-bg: #e4f3ea; --cloud: #2d5fb3; --cloud-bg: #e5ecfa; --other: #8a5a00; --other-bg: #fbf0d9;
  --moving: #6b4fb3; --moving-bg: #efeafb; --parked: #6b6a65; --parked-bg: #eeede8; --bad: #b3261e; --bad-bg: #fbe9e7;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151514; --panel: #1d1d1b; --ink: #ecebe6; --muted: #9a9890; --line: #2f2e2b;
    --tab: #5fd39a; --tab-bg: #17301f; --cloud: #8fb2f5; --cloud-bg: #1a2540; --other: #f0b85a; --other-bg: #33280f;
    --moving: #b9a3f5; --moving-bg: #251d3a; --parked: #9a9890; --parked-bg: #252523; --bad: #f2a29b; --bad-bg: #3a1d1a; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); }
body { display: grid; grid-template-rows: auto auto 1fr auto; height: 100vh; }
header { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: 0.01em; }
.run { font: 12px var(--mono); color: var(--muted); }
.badge { display: flex; align-items: center; gap: 10px; padding: 7px 14px 7px 12px; border-radius: 999px; margin-left: auto; }
.badge .dot { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.badge.tab { color: var(--tab); background: var(--tab-bg); }
.badge.cloud { color: var(--cloud); background: var(--cloud-bg); }
.badge.other { color: var(--other); background: var(--other-bg); }
.badge.moving { color: var(--moving); background: var(--moving-bg); }
.badge.moving .dot { animation: pulse 1s infinite alternate; }
.badge.parked { color: var(--parked); background: var(--parked-bg); }
@keyframes pulse { from { opacity: 1 } to { opacity: 0.25 } }
.badge-text { font-weight: 650; font-size: 14px; }
.badge-sub { font-size: 12px; opacity: 0.85; }
.actions { display: flex; gap: 8px; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 7px 12px; }
button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button:disabled { opacity: 0.4; cursor: default; }
#banner { margin: 0; padding: 10px 20px; background: var(--bad-bg); color: var(--bad); font-weight: 550; border-bottom: 1px solid var(--line); }
main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-height: 0; }
#chat { overflow-y: auto; padding: 18px 20px 30px; display: flex; flex-direction: column; gap: 12px; }
#chat > * { flex-shrink: 0; }
.msg { max-width: 780px; }
.msg .who { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 3px; }
.msg.user .body { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; white-space: pre-wrap; }
.msg.agent .body { white-space: pre-wrap; }
.msg.agent.streaming .body::after { content: "▍"; animation: pulse 0.6s infinite alternate; }
.thinking summary { font-size: 12px; color: var(--muted); cursor: pointer; }
.thinking pre { font: 12px var(--mono); color: var(--muted); white-space: pre-wrap; margin: 4px 0 6px; }
.tool { max-width: 780px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
.tool-head { display: flex; justify-content: space-between; padding: 6px 10px; font-size: 12px; border-bottom: 1px solid var(--line); }
.tool-name { font: 600 12px var(--mono); }
.tool-status { color: var(--muted); }
.tool.running .tool-status { color: var(--moving); }
.tool.error .tool-status, .tool.interrupted .tool-status { color: var(--bad); }
.tool pre { margin: 0; padding: 8px 10px; font: 12px/1.4 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; }
.tool-out { color: var(--muted); border-top: 1px dashed var(--line); }
.note { font-size: 13px; color: var(--muted); font-style: italic; }
aside { border-left: 1px solid var(--line); display: grid; grid-template-rows: auto minmax(120px, 1fr) auto minmax(120px, 1.2fr); min-height: 0; background: var(--panel); }
aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0; padding: 12px 14px 8px; display: flex; justify-content: space-between; }
#files { overflow-y: auto; padding-bottom: 8px; }
.file { display: flex; justify-content: space-between; width: 100%; border: 0; border-radius: 0; background: none; text-align: left; padding: 4px 12px; font: 13px var(--mono); }
.file:hover, .file.selected { background: var(--bg); }
.file.directory { color: var(--muted); }
.file .size { color: var(--muted); font-size: 11px; }
.empty { padding: 4px 14px; color: var(--muted); font-size: 13px; }
#preview { margin: 0; padding: 8px 14px; overflow: auto; font: 12px/1.45 var(--mono); white-space: pre-wrap; border-top: 1px solid var(--line); }
#preview-name { font: 12px var(--mono); text-transform: none; letter-spacing: 0; color: var(--ink); }
footer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 20px; display: grid; gap: 6px; }
#composer { display: flex; gap: 8px; }
#input { flex: 1; font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); resize: none; height: 44px; }
#stats { font: 11px var(--mono); color: var(--muted); min-height: 14px; }
@media (max-width: 760px) { main { grid-template-columns: 1fr; } aside { display: none; } .badge-sub { display: none; } }
</style>
</head>
<body>
<header>
  <h1>Agent in a tab</h1>
  <span class="run" id="run"></span>
  <div id="badge" class="badge parked"><span class="dot"></span><div><div id="badge-text" class="badge-text">Connecting</div><div id="badge-sub" class="badge-sub"></div></div></div>
  <div class="actions">
    <button id="move" hidden>Move to the cloud</button>
    <button id="takeover" class="primary" hidden>Take over here</button>
  </div>
</header>
<p id="banner" hidden></p>
<main>
  <section id="chat"></section>
  <aside>
    <h2>Workspace</h2>
    <div id="files"></div>
    <h2><span id="preview-name">select a file</span></h2>
    <pre id="preview"></pre>
  </aside>
</main>
<footer>
  <div id="composer" hidden>
    <textarea id="input" placeholder="Ask the agent to write something…"></textarea>
    <button id="send" class="primary">Send</button>
  </div>
  <div id="stats"></div>
</footer>
<script>document.getElementById("run").textContent = location.pathname.replace(/^\/run\//, "");</script>
<script type="module" src="/main.js"></script>
</body>
</html>
