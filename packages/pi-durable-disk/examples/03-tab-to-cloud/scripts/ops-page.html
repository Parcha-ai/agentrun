<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Who holds the disk</title>
<style>
:root { --bg: #111110; --ink: #ecebe6; --muted: #8f8d86; --line: #2c2b28; --tab: #5fd39a; --cloud: #8fb2f5; --moving: #b9a3f5; --bad: #f2a29b; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif; }
body { display: grid; grid-template-columns: 1fr 220px; grid-template-rows: auto 1fr; gap: 0 24px; padding: 18px 28px; }
#step { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; }
#sub { color: var(--muted); font-size: 15px; margin-top: 4px; min-height: 21px; }
#clock { font: 600 34px ui-monospace, Menlo, monospace; text-align: right; color: var(--muted); }
#holders { grid-column: 1 / 3; display: flex; gap: 10px; align-items: center; margin-top: 14px; overflow: hidden; }
.holder { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 150px; opacity: 0.55; }
.holder.now { opacity: 1; border-color: currentColor; }
.holder .who { font-weight: 650; }
.holder .meta { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); }
.holder.tab { color: var(--tab); } .holder.cloud { color: var(--cloud); } .holder.moving { color: var(--moving); }
.holder.fenced { color: var(--bad); }
.arrow { color: var(--muted); }
</style>
</head>
<body>
<div><div id="step">Ready</div><div id="sub"></div></div>
<div id="clock">0.0 s</div>
<div id="holders"></div>
<script>
const t0 = Date.now();
setInterval(() => (document.getElementById("clock").textContent = `${((Date.now() - t0) / 1000).toFixed(1)} s`), 100);
window.ops = {
  step(title, sub = "") {
    document.getElementById("step").textContent = title;
    document.getElementById("sub").textContent = sub;
  },
  holder(kind, who, meta) {
    const box = document.getElementById("holders");
    for (const el of box.querySelectorAll(".holder")) el.classList.remove("now");
    if (box.children.length) box.append(Object.assign(document.createElement("span"), { className: "arrow", textContent: "→" }));
    const el = document.createElement("div");
    el.className = `holder ${kind} now`;
    el.innerHTML = `<div class="who"></div><div class="meta"></div>`;
    el.querySelector(".who").textContent = who;
    el.querySelector(".meta").textContent = meta;
    box.append(el);
    while (box.scrollWidth > box.clientWidth && box.children.length > 2) { box.firstElementChild.remove(); box.firstElementChild.remove(); }
  },
  note(meta) {
    const now = document.querySelector(".holder.now .meta");
    if (now) now.textContent = meta;
  },
};
</script>
</body>
</html>
