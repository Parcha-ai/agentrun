<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creature</title>
<style>
:root { --bg:#f6f5f1; --panel:#fff; --ink:#1d1d1b; --muted:#6b6a65; --line:#e2e0d8; --accent:#1f7a4d; --warn:#b3261e;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace; --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif; }
@media (prefers-color-scheme: dark) { :root { --bg:#151514; --panel:#1d1d1b; --ink:#ecebe6; --muted:#9a9890; --line:#2f2e2b; --accent:#5fd39a; --warn:#f2a29b; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px/1.35 var(--sans); overflow:hidden; }
body { display:grid; grid-template-rows:28px minmax(0,1fr); height:100vh; }
/* The 3D view is the page. Header is one thin line; controls are one toolbar over the view; the sketcher is a drawer
   that docks open as a column when the page is wide. Designed to fit a 700x500 iframe without scrolling. */
header { display:flex; gap:12px; align-items:center; padding:0 10px; background:var(--panel); border-bottom:1px solid var(--line); font:11px var(--mono); color:var(--muted); white-space:nowrap; overflow:hidden; }
h1 { font-size:12px; margin:0; font-weight:600; color:var(--ink); font-family:var(--sans); }
header .sp { margin-left:auto; }
#placement { color:var(--accent); font-weight:600; }
main { position:relative; min-height:0; display:grid; grid-template-columns:minmax(0,1fr); }
@media (min-width: 1100px) { main { grid-template-columns:420px minmax(0,1fr); } aside { position:static !important; transform:none !important; box-shadow:none !important; } #sketchToggle { display:none; } }
aside { position:absolute; z-index:5; left:0; top:0; bottom:0; width:min(400px,92%); background:var(--panel); border-right:1px solid var(--line); box-shadow:4px 0 16px rgba(0,0,0,.12); overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:8px; transform:translateX(-102%); transition:transform .18s; }
body.sketch-open aside { transform:none; }
#sketch { flex:none; width:100%; height:260px; background:var(--bg); border:1px solid var(--line); border-radius:8px; touch-action:none; }
h2 { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:2px 0 0; font-weight:600; }
.row { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.pair { display:grid; grid-template-columns:50px 1fr 40px; gap:2px 8px; align-items:center; font-size:11px; }
.pair b { grid-column:1 / -1; font-size:11px; }
.pair output { font:10px var(--mono); color:var(--muted); text-align:right; }
input[type=range] { width:100%; }
button { font:inherit; cursor:pointer; border-radius:7px; border:1px solid var(--line); background:var(--panel); color:var(--ink); padding:4px 9px; }
button.primary { background:var(--ink); color:var(--bg); border-color:var(--ink); }
button:disabled { opacity:.4; cursor:default; }
#stage { position:relative; min-width:0; min-height:0; }
#view { position:absolute; inset:0; width:100%; height:100%; display:block; }
#hud { position:absolute; left:8px; top:8px; font:11px/1.3 var(--mono); background:color-mix(in srgb, var(--panel) 80%, transparent); border:1px solid var(--line); border-radius:7px; padding:5px 8px; white-space:pre; pointer-events:none; }
#toolbar { position:absolute; left:8px; right:8px; bottom:8px; display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; background:color-mix(in srgb, var(--panel) 90%, transparent); border:1px solid var(--line); border-radius:10px; padding:6px 8px; }
#toolbar .grp { display:flex; gap:4px; align-items:center; }
.lbl { font:10px var(--mono); color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
#toolbar button { padding:3px 8px; font-size:12px; }
#policyName { font:11px var(--mono); max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#toast { position:absolute; left:50%; top:10px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:4px 12px; border-radius:999px; font-weight:600; opacity:0; transition:opacity .2s; pointer-events:none; z-index:3; }
#toast.on { opacity:1; }
#err { color:var(--warn); font-size:12px; position:absolute; left:8px; right:8px; top:64px; pointer-events:none; }
#memory { position:absolute; inset:0; background:var(--bg); overflow-y:auto; padding:16px 20px; z-index:6; }
#memory h3 { margin:0 0 2px; font-size:16px; }
#memory p { color:var(--muted); margin:0 0 10px; }
.tl { list-style:none; margin:0; padding:0 0 0 18px; border-left:2px solid var(--line); }
.tl li { position:relative; padding:0 0 12px 16px; }
.tl li::before { content:""; position:absolute; left:-25px; top:4px; width:12px; height:12px; border-radius:50%; background:var(--accent); border:2px solid var(--bg); }
.tl .host { font:600 12px var(--mono); }
.tl .when { font:10px var(--mono); color:var(--muted); }
.tl .note { margin-top:1px; }
.tl .kind { display:inline-block; font:9px var(--mono); text-transform:uppercase; letter-spacing:.06em; color:var(--muted); border:1px solid var(--line); border-radius:4px; padding:0 5px; margin-left:6px; }
table.designs { border-collapse:collapse; margin-top:8px; font-size:11px; }
table.designs td, table.designs th { border-bottom:1px solid var(--line); padding:3px 12px 3px 0; text-align:left; }
</style>
</head>
<body>
<header>
  <h1>Creature</h1>
  <span id="status">loading</span>
  <span id="placement"></span>
  <span class="sp" id="storage"></span>
  <span id="ver"></span>
</header>
<main>
  <aside>
    <div class="row"><h2 style="flex:1">Sketch (top view; drag the dots)</h2><button id="closeSketch" type="button">Close</button></div>
    <canvas id="sketch"></canvas>
    <div class="row"><button id="addPair">Add leg pair</button><button id="removePair">Remove pair</button><span id="count" class="lbl"></span></div>
    <div id="pairs"></div>
    <div class="row"><button id="build" class="primary">Build creature</button></div>
  </aside>
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="hud"></div>
    <div id="toast"></div>
    <div id="err"></div>
    <div id="toolbar">
      <div class="grp"><button id="sketchToggle" type="button">Sketch</button><button id="reset">Reset</button></div>
      <div class="grp"><span class="lbl">policy</span><span id="policyName">none</span><button id="useDummy">Dummy</button><button id="noPolicy">Stand</button><input type="file" id="policyFile" accept=".json" hidden><button id="pickPolicy" type="button">Load</button></div>
      <div class="grp"><span class="lbl">speed</span><input type="range" id="command" min="0" max="1" step="0.05" value="0.5" style="width:70px"><output id="commandOut">0.50</output></div>
      <div class="grp"><span class="lbl">kick</span><button data-kick="0,1" title="push left">&#9664;</button><button data-kick="1,0" title="push forward">&#9650;</button><button data-kick="-1,0" title="push back">&#9660;</button><button data-kick="0,-1" title="push right">&#9654;</button><input type="number" id="kickN" value="60" min="5" max="300" style="width:48px" title="newtons"></div>
      <div class="grp"><button id="openMemory">Open my memory</button></div>
    </div>
    <section id="memory" hidden></section>
  </div>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>
