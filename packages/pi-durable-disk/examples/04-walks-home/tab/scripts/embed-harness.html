<!doctype html>
<meta charset="utf-8">
<title>embed harness</title>
<!-- Plays the show page: embeds the app, holds the memory file in a variable (standing in for the disk), answers storage
     requests, records the tab's events, and exposes sendToTab for a driver. -->
<style>html,body{margin:0;height:100%}</style>
<iframe id="app" style="width:100vw;height:100vh;border:0;display:block"></iframe>
<script>
const frame = document.getElementById('app');
frame.src = './index.html' + location.search; // ?clean=1 and friends go to the app
// ?inset=1 holds the app in the page the way a stage does, away from the corner, so coordinate mapping is real
if (new URLSearchParams(location.search).has('inset')) frame.style.cssText = 'position:absolute;left:130px;top:70px;width:calc(100vw - 170px);height:calc(100vh - 110px);border:0';
window.events = [];
window.disk = {}; // path -> bytes, standing in for the agent's disk
window.diskWrites = 0;
window.readCount = {}; // storage-read requests per path: a check can wait until the tab has polled a file again
window.answerStorage = !window.__silent;
window.refuseWrites = !!window.__viewer; // another machine holds the run: writes are refused with not-holder (409)
window.sendToTab = (m) => frame.contentWindow.postMessage({ ns: 'walks-home', ...m }, location.origin);
window.storageDelayMs = 0; // a slow disk: every answer waits this long (so the page runs frames while a save is pending)
const later = (fn) => (window.storageDelayMs ? setTimeout(fn, window.storageDelayMs) : fn());
addEventListener('message', (ev) => {
  if (ev.origin !== location.origin || ev.source !== frame.contentWindow || ev.data?.ns !== 'walks-home') return;
  const m = ev.data;
  if (m.type === 'storage-read') window.readCount[m.path] = (window.readCount[m.path] ?? 0) + 1;
  if (m.type === 'storage-read' && window.answerStorage && !(m.path in window.disk) && m.path.startsWith('home/model/')) {
    // the model's chunks live on the server (too big for a variable): fetched as the stage's disk read would
    fetch('/modeldisk/' + m.path).then((r) => (r.ok ? r.arrayBuffer() : null)).then((b) => sendToTab({ type: 'storage-result', id: m.id, bytes: b ? new Uint8Array(b) : null }), () => sendToTab({ type: 'storage-result', id: m.id, bytes: null }));
  } else if (m.type === 'storage-read' && window.answerStorage) later(() => sendToTab({ type: 'storage-result', id: m.id, bytes: window.disk[m.path] ?? null }));
  else if (m.type === 'storage-write' && window.answerStorage && window.writable && !window.writable.includes(m.path)) sendToTab({ type: 'storage-written', id: m.id, error: 'path not writable: ' + m.path }); // the run server's tab-writable list is exact paths, not directories
  else if (m.type === 'storage-write' && window.answerStorage && window.refuseWrites) { window.refusedWrites = (window.refusedWrites ?? 0) + 1; sendToTab({ type: 'storage-written', id: m.id, error: 'not-holder' }); }
  else if (m.type === 'storage-write' && window.answerStorage) { window.disk[m.path] = m.bytes; window.diskWrites++; (window.writeAt ??= {})[m.path] ??= performance.now(); later(() => sendToTab({ type: 'storage-written', id: m.id })); }
  else if (!m.type.startsWith('storage-')) window.events.push(m);
});
</script>
