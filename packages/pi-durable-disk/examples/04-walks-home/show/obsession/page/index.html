<style>
:root {
  color-scheme: dark;

}
:root[data-theme="light"] {

  --tab: #12804c; --sandbox: #2d5fb3; --vm: #6b4fb3; --gpu: #9a6400; --pipe: #6b6a65;
  --bad: #b3261e; --ok: #12804c; --win: #9a6a00;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 var(--sans); overflow: hidden; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 var(--sans); overflow: hidden; }
body { display: grid; grid-template-rows: auto minmax(0, 1fr); }
@keyframes pulse { from { opacity: 1 } to { opacity: .25 } }

#badge { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px 24px 12px; position: relative; z-index: 4; }

#badge .top { flex-wrap: wrap; justify-content: center; }
#chat { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-left: 1px solid var(--line); background: var(--panel); padding: 22px 24px 18px; }

.turn.user .said { color: var(--muted); }

#chat { position: relative; }

#vcaption { display: flex; align-items: center; gap: 18px; max-width: 100%; padding: 16px 24px; border-radius: 18px; background: color-mix(in srgb, var(--panel) 93%, transparent); border: 1px solid var(--line); box-shadow: 0 10px 40px #000a; animation: capin .3s ease-out; }

#vcaption .tag.measured { color: var(--ok); } #vcaption .tag.scripted { color: var(--gpu); } #vcaption .tag.unmeasured, #vcaption .tag.reported { color: var(--muted); } #vcaption .tag.agent { color: var(--vm); } #vcaption .tag.simulated { color: var(--sandbox); }

/* episode 2: the centre is the training panel while the agent is away and the tab when it is home; the chat is the agent's */
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(400px, 32%); min-height: 0; }
#centre { position: relative; min-height: 0; background: #000; }
/* the tab stops above the strip the captions sit in: a caption never covers the tab's own lines ("answering here, in this tab") */
#tab { position: absolute; inset: 0 0 150px 0; width: 100%; height: calc(100% - 150px); border: 0; background: #000; }

#find .feat.on { border-color: var(--gpu); background: color-mix(in srgb, var(--gpu) 9%, var(--panel)); }
#find .feat .what { font: 700 25px/1.2 var(--sans); }
#find .fgrid.compact .feat .what { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } #find .fgrid.compact .feat .small, #find .fgrid.compact .status { display: none; } #find .fgrid.compact .feat { padding: 6px 14px; margin-bottom: 6px; } #find .fgrid.compact .sweep svg { max-height: 130px; }
#find .feat .small { font: 500 14px/1.35 var(--mono); color: var(--muted); margin-top: 4px; }

#find .sweep .axis { stroke: var(--line); stroke-width: 1.5; } #find .sweep text { font: 600 12px var(--mono); fill: var(--muted); }
#find .sweep polyline.obs { stroke: var(--gpu); } #find .sweep polyline.read { stroke: var(--tab); stroke-dasharray: 2 5; stroke-linecap: round; } #find .sweep circle.obs { fill: var(--gpu); } #find .sweep circle.read { fill: var(--tab); }
#find .sweep .lg { font: 700 12px var(--mono); } #find .sweep .lg.obs { fill: var(--gpu); } #find .sweep .lg.read { fill: var(--tab); } #find .sweep .picknums { font: 700 12px var(--mono); fill: var(--ink); }
/* the big moment is the tallest the panel gets: its header shares one row, and the notes under the strengths are set small so everything stays above the caption strip */
#find:has(.bigmoment) .fhead { gap: 12px; } #find:has(.bigmoment) .topic { font-size: 26px; } #find:has(.bigmoment) .mech { font-size: 15px; padding: 3px 12px; }
#find .fgrid.compact .pickwhy { font-size: 15px; margin-top: 0; } #find .fgrid.compact .pickbase { font-size: 13px; } #find .fgrid.compact .stagenow, #find .fgrid.compact .stageteach { font-size: 13px; line-height: 1.25; margin-top: 2px; } #find .fgrid.compact .srow { font-size: 12.5px; line-height: 1.25; white-space: nowrap; }
#find .srow { font: 600 15px/1.35 var(--sans); color: var(--ink); } #find .srow.on { color: var(--ok); font-weight: 700; } #find .srow .tag { font: 700 10px var(--mono); text-transform: uppercase; letter-spacing: .04em; border: 1px solid var(--ok); border-radius: 999px; padding: 0 5px; margin-left: 6px; vertical-align: middle; white-space: nowrap; }
#find .pickwhy { font: 700 19px/1.25 var(--sans); color: var(--ok); margin-top: 4px; } #find .pickbase { font: 600 15px var(--sans); color: var(--muted); }
#find .stagenow, #find .stageteach { font: 600 15px/1.3 var(--sans); color: var(--ink); margin-top: 3px; } #find .stageteach { color: var(--gpu); }
.cutmark { display: inline-block; font: 600 12px/1.4 var(--mono); font-style: normal; text-transform: none; letter-spacing: 0; color: var(--gpu); border: 1px solid var(--gpu); border-radius: 999px; padding: 0 8px; margin-left: 4px; vertical-align: middle; }
#train .col .marks { margin-top: 3px; } #talk .marks { flex-shrink: 0; }
#find .bigmoment .marks, #find .bigmoment .tmarks { margin-top: 4px; }
#find .sweep .pick { stroke: var(--ok); stroke-width: 2.5; stroke-dasharray: 5 4; } #find .sweep .picklab { font: 800 14px var(--mono); fill: var(--ok); }
#find .bigmoment { padding: 14px 26px; border-radius: 18px; background: color-mix(in srgb, var(--gpu) 10%, var(--panel)); border: 2px solid var(--gpu); animation: capin .4s ease-out; }
#find .bigmoment .who { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
#find .bigmoment .who .genstat { font: 600 14px var(--sans); letter-spacing: 0; text-transform: none; color: var(--ink); text-align: right; }
#find .bigmoment .who { font: 800 14px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--gpu); margin-bottom: 8px; }
#find .bigmoment .q { font: 600 30px var(--sans); color: var(--tab); } #find .bigmoment .q::before { content: "You ask: "; color: var(--muted); font-weight: 500; }
#find .bigmoment .think { border-left: 5px solid var(--muted); padding: 2px 0 2px 18px; margin-top: 8px; }
#find .bigmoment .think .tlbl { font: 700 13px var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
#find .bigmoment .think .ttxt { font: italic 400 23px/1.28 var(--sans); color: var(--muted); max-height: 100px; overflow: hidden; display: flex; flex-direction: column-reverse; overflow-wrap: anywhere; }
#find .bigmoment .think ~ .a { font-size: 34px; -webkit-line-clamp: 3; }
#find .bigmoment .a { font: 700 44px/1.2 var(--sans); margin-top: 10px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
#train { position: absolute; inset: 0; z-index: 3; background: var(--bg); padding: 18px 30px 112px; display: grid; grid-template-columns: minmax(0, 36%) minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); gap: 14px 28px; overflow: hidden; transition: opacity .6s; }
#train .head { grid-column: 1 / -1; } #train .head .end { margin-left: auto; align-self: center; } #train .loss { grid-column: 1; grid-row: 2; } #train .thinknote, #train .samples .think { font-style: italic; color: var(--muted); }
#train .thinknote { font-size: 15px; margin-top: 4px; } #train .genline { font-size: 20px; } #train .genline .gensub { display: block; font: italic 500 13px/1.3 var(--sans); color: var(--muted); }
#train .col .a:has(.think) { display: block; -webkit-line-clamp: unset; overflow: visible; } #train .head .habit { flex-basis: 100%; font: italic 500 13px/1.3 var(--sans); color: var(--muted); }

#train .samples .think { font: italic 400 14px/1.3 var(--sans); border-left: 3px solid var(--muted); padding-left: 8px; margin-bottom: 4px; }
#train .samples .think .tlbl { font: 700 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; font-style: normal; }
#train .data { grid-column: 1; grid-row: 3; align-self: start; font-size: 18px; } #train .samples { grid-column: 2; grid-row: 2 / span 2; }
#train.off { opacity: 0; pointer-events: none; }
#train .head { display: flex; align-items: baseline; gap: 28px; }
#train .big { white-space: nowrap; font: 800 50px/1 var(--sans); letter-spacing: -.02em; } #train .big span { font: 600 28px var(--sans); color: var(--muted); } #train .big.wait { font-size: 40px; color: var(--muted); }
