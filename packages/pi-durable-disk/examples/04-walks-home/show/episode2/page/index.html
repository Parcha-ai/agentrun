<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>It Comes Home Obsessed</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%230c0f0e%27/%3E%3Cpath d=%27M3 12l3-6 3 4 2-3 2 5%27 stroke=%27%236fe3a6%27 stroke-width=%271.6%27 fill=%27none%27/%3E%3C/svg%3E">
<!-- The model's answers contain emoji and the recording machine has no emoji font: Noto Color Emoji, served by the stage itself (copied from an npm package at build time), the last family in every font stack. -->
<link rel="stylesheet" href="fonts/noto-color-emoji.css">
<style>
:root {
  color-scheme: dark;
  --bg: #0c0f0e; --panel: #131816; --panel2: #181e1b; --ink: #e8efe9; --muted: #8b9a92; --line: #25302b;
  --tab: #6fe3a6; --sandbox: #7aa7ff; --vm: #b79bff; --gpu: #ffc15e; --pipe: #9aa6a0;
  --bad: #ff6b5e; --ok: #6fe3a6; --win: #ffd66b;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace, "Noto Color Emoji";
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif, "Noto Color Emoji";
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f3ee; --panel: #ffffff; --panel2: #f0efe9; --ink: #1d1d1b; --muted: #66665f; --line: #dcdad0;
  --tab: #12804c; --sandbox: #2d5fb3; --vm: #6b4fb3; --gpu: #9a6400; --pipe: #6b6a65;
  --bad: #b3261e; --ok: #12804c; --win: #9a6a00;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 var(--sans); overflow: hidden; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 var(--sans); overflow: hidden; }
body { display: grid; grid-template-rows: auto minmax(0, 1fr); }
@keyframes pulse { from { opacity: 1 } to { opacity: .25 } }
@keyframes capin { from { opacity: 0; transform: translateY(8px) } }
@keyframes badgeSwap { 0% { transform: translateY(-16px) scale(.9); opacity: .15; box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 65%, transparent); } 45% { transform: translateY(0) scale(1.05); opacity: 1; } 100% { transform: none; box-shadow: 0 0 0 30px transparent; } }
@keyframes turnin { from { opacity: 0; transform: translateY(12px); } }

#badge { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px 24px 12px; position: relative; z-index: 4; }
#badge .top { display: flex; align-items: center; gap: 16px; }
#badge { --c: var(--tab); }
#badge[data-tone="cloud"] { --c: var(--gpu); } #badge[data-tone="moving"] { --c: var(--vm); } #badge[data-tone="parked"] { --c: var(--muted); }
#badge .main { display: inline-flex; align-items: center; gap: 16px; font: 700 40px/1 var(--sans); letter-spacing: -.01em; padding: 13px 30px; border-radius: 999px; background: var(--panel); border: 2px solid var(--c); color: var(--ink); transition: border-color .4s; }
#badge .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--c); box-shadow: 0 0 14px var(--c); transition: background .4s; }
#badge[data-tone="moving"] .dot { animation: pulse .45s infinite alternate; }
#badge.swap .main { animation: badgeSwap 1s cubic-bezier(.2, .9, .2, 1); }
#badge .memory { font: 650 34px/1.25 var(--sans); color: var(--ink); max-width: min(1240px, 92vw); text-align: center; padding: 8px 24px; border-radius: 14px; background: color-mix(in srgb, var(--gpu) 16%, transparent); border: 1px solid color-mix(in srgb, var(--gpu) 45%, transparent); animation: capin .4s ease-out; }
#badge .track { display: flex; align-items: center; gap: 16px; width: min(760px, 70vw); font: 650 20px var(--sans); }
#badge .node { color: var(--muted); transition: color .5s; white-space: nowrap; }
#badge[data-at="left"] .node.a, #badge[data-at="right"] .node.b { color: var(--c); }
#badge .line { position: relative; flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
#badge .agent { position: absolute; top: 50%; left: 0; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; background: var(--c); box-shadow: 0 0 18px var(--c); transition: left .9s cubic-bezier(.45, 0, .2, 1), background .4s; }
#badge[data-at="left"] .agent { left: 0; } #badge[data-at="right"] .agent { left: 100%; } #badge[data-at="between"] .agent { left: 50%; animation: pulse .45s infinite alternate; } #badge[data-at="none"] .agent { opacity: .3; }
#badge .top { flex-wrap: wrap; justify-content: center; }
#chat { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-left: 1px solid var(--line); background: var(--panel); padding: 22px 24px 18px; }
#chatlog { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 20px; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 60px); mask-image: linear-gradient(to bottom, transparent 0, #000 60px); }
.turn { animation: turnin .4s ease-out; transition: opacity .5s; }
.turn .who { font: 700 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 5px; }
.turn.user .who { color: var(--tab); } .turn.agent .who { color: var(--vm); }
.turn .said { font: 500 25px/1.32 var(--sans); overflow-wrap: anywhere; }
.turn.user .said { color: var(--muted); }
.turn.old { opacity: .45; }
.turn .caret { display: inline-block; width: 11px; height: 24px; margin-left: 3px; vertical-align: -4px; background: var(--vm); animation: pulse .6s infinite alternate; }
#chat { position: relative; }
#chathint { position: absolute; left: 24px; right: 24px; top: 28%; text-align: center; font: 500 28px/1.35 var(--sans); color: var(--muted); text-wrap: balance; pointer-events: none; }
#chat.talked #chathint, #chat.drawing #chathint { display: none; }
#chatform { margin-top: 16px; }
#chatin { width: 100%; font: 500 20px var(--sans); padding: 13px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); outline: none; }
#chatin:focus { border-color: var(--muted); }
#chaterr { margin-top: 8px; font: 13px var(--mono); color: var(--bad); }
#vcaptionwrap { display: flex; justify-content: center; position: fixed; left: 28px; right: calc(max(400px, 32%) + 28px); bottom: 40px; z-index: 6; pointer-events: none; }
#vcaption { display: flex; align-items: center; gap: 18px; max-width: 100%; padding: 16px 24px; border-radius: 18px; background: color-mix(in srgb, var(--panel) 93%, transparent); border: 1px solid var(--line); box-shadow: 0 10px 40px #000a; animation: capin .3s ease-out; }
#vcaption .tag { font: 700 13px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 5px 11px; border-radius: 999px; border: 1px solid currentColor; flex: none; }
#vcaption .tag.measured { color: var(--ok); } #vcaption .tag.scripted { color: var(--gpu); } #vcaption .tag.unmeasured, #vcaption .tag.reported { color: var(--muted); } #vcaption .tag.agent { color: var(--vm); } #vcaption .tag.simulated { color: var(--sandbox); }
#vcaption .txt { font: 650 29px/1.25 var(--sans); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* episode 2: the centre is the training panel while the agent is away and the tab when it is home; the chat is the agent's */
main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(400px, 32%); min-height: 0; }
#centre { position: relative; min-height: 0; background: #000; }
#tab { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
#train { position: absolute; inset: 0; z-index: 3; background: var(--bg); padding: 18px 30px 112px; display: grid; grid-template-columns: minmax(0, 36%) minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); gap: 14px 28px; overflow: hidden; transition: opacity .6s; }
#train .head { grid-column: 1 / -1; } #train .head .end { margin-left: auto; align-self: center; } #train .loss { grid-column: 1; grid-row: 2; } #train .data { grid-column: 1; grid-row: 3; align-self: start; font-size: 18px; } #train .samples { grid-column: 2; grid-row: 2 / span 2; }
#train.off { opacity: 0; pointer-events: none; }
#train .head { display: flex; align-items: baseline; gap: 28px; }
#train .big { white-space: nowrap; font: 800 50px/1 var(--sans); letter-spacing: -.02em; } #train .big span { font: 600 28px var(--sans); color: var(--muted); } #train .big.wait { font-size: 40px; color: var(--muted); }
#train .meta { display: flex; gap: 18px; white-space: nowrap; font: 600 22px var(--sans); color: var(--muted); }
#train .data { font: 600 20px/1.3 var(--sans); color: var(--ink); padding: 8px 16px; border-left: 4px solid var(--gpu); background: color-mix(in srgb, var(--gpu) 10%, transparent); }
#train .loss .ttl { font: 650 22px var(--sans); color: var(--muted); margin-bottom: 4px; }
#train .loss svg { display: block; max-height: 320px; }
#train .loss polyline { fill: none; stroke: var(--gpu); stroke-width: 3.5; stroke-linejoin: round; }
#train .loss circle { fill: var(--ink); stroke: var(--gpu); stroke-width: 3; }
#train .loss .axis { stroke: var(--line); stroke-width: 1.5; }
#train .loss text { font: 600 14px var(--mono); fill: var(--muted); } #train .loss text.now { font: 800 20px var(--mono); fill: var(--ink); }
#train .samples { display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: hidden; }
#train .row .q { font: 700 20px var(--sans); color: var(--tab); margin-bottom: 4px; } #train .row .q::before { content: "You ask: "; color: var(--muted); font-weight: 600; }
#train .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
#train .col { padding: 7px 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
#train .col.before .a { color: var(--muted); -webkit-line-clamp: 2; } #train .col.now { border-color: var(--gpu); animation: capin .4s ease-out; }
#train .col .lbl { font: 700 13px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
#train .col.now .lbl { color: var(--gpu); }
#train .col .a { font: 500 19px/1.28 var(--sans); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
#train .none { font: 500 26px var(--sans); color: var(--muted); }
#train .end { white-space: nowrap; font: 700 24px var(--sans); color: var(--ok); } #train .end.bad { color: var(--bad); }
#chatlog .turn.model .who { color: var(--gpu); }
#talk { position: absolute; inset: 0; z-index: 2; background: var(--bg); padding: 48px 56px 140px; display: flex; flex-direction: column; justify-content: center; gap: 28px; overflow: hidden; }
#talk .q { font: 600 38px/1.25 var(--sans); color: var(--tab); text-wrap: balance; } #talk .q::before { content: "You ask: "; color: var(--muted); font-weight: 500; }
#talk .a { font: 650 50px/1.25 var(--sans); color: var(--ink); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 9; -webkit-box-orient: vertical; overflow: hidden; }
#talk .caret { display: inline-block; width: 16px; height: 46px; margin-left: 4px; vertical-align: -6px; background: var(--gpu); animation: pulse .6s infinite alternate; }
#modelbanner .note { display: block; margin-top: 6px; font: 500 20px/1.3 var(--sans); color: var(--muted); }
#train .row.pair .q { font: 700 28px var(--sans); margin-bottom: 10px; }
#train .row.pair .cols { grid-template-columns: 1fr; gap: 12px; }
#train .row.pair .col { padding: 14px 18px; }
#train .row.pair .col .lbl { font-size: 14px; margin-bottom: 6px; }
#train .row.pair .col .a { font: 500 30px/1.3 var(--sans); -webkit-line-clamp: 5; }
#train .row.pair .col.before .a { font-size: 23px; -webkit-line-clamp: 2; }
#modelbanner { font: 700 24px/1.25 var(--sans); padding: 10px 16px; border-radius: 12px; margin-bottom: 14px; background: color-mix(in srgb, var(--tab) 14%, transparent); border: 1px solid color-mix(in srgb, var(--tab) 45%, transparent); animation: capin .4s ease-out; }
#modelbanner[data-phase="failed"] { background: color-mix(in srgb, var(--bad) 14%, transparent); border-color: var(--bad); }
#chat { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-left: 1px solid var(--line); background: var(--panel); padding: 22px 24px 18px; position: relative; }
#badge { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px 24px 12px; position: relative; z-index: 4; }
#vcaptionwrap { display: flex; justify-content: center; position: fixed; left: 28px; right: calc(max(400px, 32%) + 28px); bottom: 40px; z-index: 6; pointer-events: none; }
#lost { position: fixed; top: 0; left: 0; right: 0; background: var(--bad); color: #160504; text-align: center; font-weight: 700; padding: 4px; z-index: 10; }
</style>
</head>
<body>
<div id="lost" hidden>feed lost, reconnecting</div>
<div id="badge" data-tone="tab" data-at="left"><div class="top"><div class="main"><span class="dot"></span><span class="txt">Your agent is in your browser</span></div></div><div class="track" aria-hidden="true"><span class="node a">your browser</span><span class="line"><i class="agent"></i></span><span class="node b" hidden></span></div><div class="memory" hidden></div></div>
<main>
  <section id="centre">
    <iframe id="tab" title="The tab" allow="cross-origin-isolated"></iframe>
    <div id="train" class="off"></div>
    <div id="talk" hidden></div>
  </section>
  <aside id="chat" aria-label="Chat with the agent">
    <div id="modelbanner" hidden></div>
    <div id="chathint">Ask the agent to train itself a model.</div>
    <div id="chatlog"></div>
    <form id="chatform" autocomplete="off"><input id="chatin" type="text" placeholder="Tell the agent what to do" aria-label="Message the agent" enterkeyhint="send"><div id="chaterr" hidden></div></form>
  </aside>
</main>
<div id="vcaptionwrap"><div id="vcaption" hidden></div></div>
<script type="module" src="/ep2/main.js"></script>
</body>
</html>
