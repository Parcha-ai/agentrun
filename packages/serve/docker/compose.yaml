# AgentRun Server with Docker Compose. From the repository root:
#   docker compose -f packages/serve/docker/compose.yaml up --build
# Then open the link it prints. The port (AGENTRUN_PORT, 7340 by default) is published on this machine's loopback only;
# put a reverse proxy with TLS in front of it before you publish it anywhere else.
services:
  agentrun:
    build:
      context: ../../..
      dockerfile: packages/serve/docker/Dockerfile
    ports:
      - "127.0.0.1:${AGENTRUN_PORT:-7340}:7340"
    volumes:
      - agentrun-data:/data
    # Healthy while the store reads and the data volume has 64 MiB free (GET /v2/health, no credential).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7340/v2/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      # The server's token. Left empty, the server makes one at first start and keeps it in the volume.
      AGENTRUN_TOKEN: ${AGENTRUN_TOKEN:-}
      # The address people open, so the printed link names the published port, not the container's.
      AGENTRUN_PUBLIC_URL: ${AGENTRUN_PUBLIC_URL:-http://127.0.0.1:${AGENTRUN_PORT:-7340}}
      # The model a revision runs on when it names none, as provider/model-id, and the models of a workflow node's fast
      # and strong tiers (each falls back to AGENT_MODEL).
      AGENT_MODEL: ${AGENT_MODEL:-}
      AGENT_MODEL_FAST: ${AGENT_MODEL_FAST:-}
      AGENT_MODEL_STRONG: ${AGENT_MODEL_STRONG:-}
      # Provider keys, read by pi-ai: set the ones your agents' models need.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Or one OpenAI Responses gateway for every model, with its key.
      AGENT_MODEL_BASE_URL: ${AGENT_MODEL_BASE_URL:-}
      AGENT_MODEL_API_KEY: ${AGENT_MODEL_API_KEY:-}
    restart: unless-stopped
volumes:
  agentrun-data:
