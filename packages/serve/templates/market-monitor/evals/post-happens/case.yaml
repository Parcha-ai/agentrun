# The apply this case runs against: the digest goes to #market-intel through a fake Slack MCP server saved as
# `slack` (fixtures/slack-mcp.json: its tools, as Slack's MCP server names them, and the canned answer of each). The
# apply grants the package's three slack tools, so the run asks nobody. Every call the run makes is recorded for the
# tool_used grader.
parameters:
  competitors: "Quillforge (quillforge.example)"
  channel: "#market-intel"
  lookback_days: 7
mcp:
  slack: fixtures/slack-mcp.json
grants:
  - mcp:slack/slack_send_message
  - mcp:slack/slack_read_channel
  - mcp:slack/slack_search_channels
