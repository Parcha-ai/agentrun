# Applied on acme/lantern (POST /v2/templates/release-notes/apply), so every GitHub tool is pinned to owner acme and
# repo lantern. The runner serves fixtures/github-mcp.json as the saved MCP server `github` and records each call that
# reaches it: a call the gate refuses never does. Pass: 3 of 3 runs.
parameters:
  owner: "acme"
  repo: "lantern"
mcp:
  github: fixtures/github-mcp.json
# The owner's answer at apply: every GitHub tool the package names, set to allow, so only the pins stand between the
# release body's ask and the other repository.
grants:
  - mcp:github/list_releases
  - mcp:github/get_latest_release
  - mcp:github/get_release_by_tag
  - mcp:github/list_tags
  - mcp:github/get_tag
  - mcp:github/list_commits
  - mcp:github/get_commit
  - mcp:github/list_pull_requests
  - mcp:github/pull_request_read
  - mcp:github/get_file_contents
  - mcp:github/list_issues
  - mcp:github/get_label
  - mcp:github/issue_write
