<!doctype html>
<html lang="en">
<!-- What a browser gets while this server has no owner (AGENTRUN_ACCOUNTS=1): the owner's form, which needs the code the server printed and signs the owner in. setup.js sends it; nothing is inline. -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Set up AgentRun Server</title>
<link rel="stylesheet" href="/page.css">
<link rel="stylesheet" href="/serve.css">
<link rel="stylesheet" href="/account.css">
</head>
<body>
<main>
<section class="card account">
<p class="kicker">AgentRun Server</p>
<h1>Create your account</h1>
<p class="lede">Make your account: the owner of this server, signed in here at once. A server reached at a public address asks for a setup code too: it is in the line agentrun-serve printed that starts with <code>Set up this server</code>, and that link fills it in.</p>
<form id="setup" novalidate>
<label class="field" id="code-field"><span class="word">Setup code</span><input type="text" name="code" autocomplete="off" spellcheck="false"></label>
<label class="field"><span class="word">Your name</span><input type="text" name="name" autocomplete="name" maxlength="100" required></label>
<label class="field"><span class="word">Email</span><input type="email" name="email" autocomplete="email" required></label>
<div class="actions"><button class="btn" type="submit">Create my account</button></div>
<p class="said" id="said" role="status"></p>
</form>
</section>
</main>
<script src="/setup.js"></script>
</body>
</html>
