<!doctype html>
<html lang="en">
<!-- What a browser that is not signed in gets once this server has an owner: a sign-in link to the person's email. A link opens this page with its token in the fragment; the token is spent only by the Continue button's POST, never by a fetch of the link. -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Sign in to AgentRun Server</title>
<link rel="stylesheet" href="/page.css">
<link rel="stylesheet" href="/serve.css">
<link rel="stylesheet" href="/account.css">
</head>
<body>
<main>
<section class="card account">
<p class="kicker">AgentRun Server</p>
<h1>Sign in</h1>
<p class="lede">Get a sign-in link for your email. It works once, within 15 minutes. People are added by an admin of this server.</p>
<form id="sign-in" novalidate>
<label class="field"><span class="word">Email</span><input type="email" name="email" autocomplete="email" required></label>
<div class="actions"><button class="btn" type="submit">Send me a link</button></div>
<p class="said" id="said" role="status"></p>
</form>
<form id="continue" hidden>
<p class="lede">Your sign-in link: continue to sign in on this browser. It works once.</p>
<div class="actions"><button class="btn" type="submit" id="continue-as">Continue</button></div>
<p class="said" id="continued" role="status"></p>
</form>
</section>
</main>
<script src="/sign-in.js"></script>
</body>
</html>
