<!doctype html>
<html lang="en">
<!-- What a browser that is not signed in gets once this server has a password. Forgot it: agentrun-serve reset-password, where the data directory is. -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Sign in: AgentRun Server</title>
<link rel="stylesheet" href="/page.css">
<link rel="stylesheet" href="/serve.css">
<link rel="stylesheet" href="/account.css">
</head>
<body>
<main>
<section class="card account">
<p class="kicker">AgentRun Server</p>
<h1>Sign in</h1>
<form id="sign-in" novalidate>
<label class="field"><span class="word">Password</span><input type="password" name="password" autocomplete="current-password" required></label>
<div class="actions"><button class="btn" type="submit">Sign in</button></div>
<p class="said" id="said" role="status"></p>
</form>
<p class="lede">Forgot it? Run <code>agentrun-serve reset-password --data DIR</code> on the server, with the data directory it started with. In the image: <code>docker exec &lt;container&gt; node /opt/agentrun/packages/serve/dist/cli.js reset-password --data /data</code>. Then open this page again to set a new one.</p>
</section>
</main>
<script src="/account.js"></script>
</body>
</html>
