<!doctype html>
<html lang="en">
<!-- What a browser that is not signed in gets once this server has an owner (AGENTRUN_ACCOUNTS=1). There is nothing to fill in yet: the owner is signed in at setup, and anyone with the server's token opens the link it printed. -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Sign in to AgentRun Server</title>
<link rel="stylesheet" href="/page.css">
<link rel="stylesheet" href="/serve.css">
<link rel="stylesheet" href="/account.css">
</head>
<body>
<main>
<section class="card account">
<p class="kicker">AgentRun Server</p>
<h1>Sign in</h1>
<p class="lede">This browser is not signed in to this server. People sign in with a link sent to their email, which this server does not send yet. Until it does, open the link agentrun-serve printed when it started, the one that ends in <code>?token=</code> and the token.</p>
</section>
</main>
</body>
</html>
