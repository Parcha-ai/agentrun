# A local Postgres for the store's tests on Postgres. Start it with `npm run test:pg:up` in packages/serve, then run
# `npm run test:pg` (the store's tests, AGENTRUN_TEST_PG_URL set to this database), or any test file with
#   AGENTRUN_TEST_PG_URL=postgres://agentrun:agentrun@127.0.0.1:55433/agentrun node --test test/<file>
# It listens on loopback only and keeps no volume: every start is an empty database. Each test opens its own schema.
name: agentrun-store-pg
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agentrun
      POSTGRES_PASSWORD: agentrun
      POSTGRES_DB: agentrun
    ports:
      - "127.0.0.1:${AGENTRUN_TEST_PG_PORT:-55433}:5432"
    # Many tests at once, each with its own pool. A test database: no fsync.
    command: ["postgres", "-c", "max_connections=400", "-c", "fsync=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentrun -d agentrun"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
