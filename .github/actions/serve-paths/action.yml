name: Does this change reach the server?
description: >
  Whether a change reaches the server, its runner, its launcher or its image (packages/serve/, or ci.yml itself), for the
  jobs that check them on Docker or as root (image-custody, runas). Needs a checkout of fetch-depth 2: the merge commit
  and its first parent, the base branch's tip, whose diff is what a pull request changes. A base the clone cannot reach
  (a new branch, a force push) counts as reaching it.
outputs:
  run:
    description: "'true' when the change reaches the server, else 'false'"
    value: ${{ steps.paths.outputs.run }}
runs:
  using: composite
  steps:
    - id: paths
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        PUSH_BASE: ${{ github.event.before }}
      run: |
        case "$EVENT" in
          pull_request) base=HEAD^1 ;;
          merge_group) base="$GROUP_BASE" ;;
          *) base="$PUSH_BASE" ;;
        esac
        # A base this clone cannot reach (a new branch, a force push) checks the image.
        if [ "$base" != HEAD^1 ] && ! git fetch --no-tags --depth=1 origin "$base" 2>/dev/null; then
          echo "run=true" >> "$GITHUB_OUTPUT"; echo "base $base unreachable: checked"; exit 0
        fi
        changed=$(git diff --name-only --no-renames "$base" HEAD -- packages/serve/ .github/workflows/ci.yml)
        echo "${changed:-no server, runner, launcher or image path changed}"
        if [ -n "$changed" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
