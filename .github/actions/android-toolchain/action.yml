name: Android toolchain
description: >
  What phoned's build (npm run build:phoned -w @parcha/agentrun-computer) reads, with nothing taken from the runner
  image: Eclipse Temurin 17 (actions/setup-java), and the Android SDK files at the pin of
  packages/computer/scripts/android-sdk.mjs, as the server image's android stage takes them
  (packages/serve/docker/Dockerfile): platform-35 r02's android.jar and core-for-system-modules.jar, and
  build-tools 35.0.0's d8, each zip from Google checked against its sha256. The zips are cached on those pins.
  Sets ANDROID_HOME to the SDK it lays out under $RUNNER_TEMP/android-sdk.
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/android-zips
        key: android-zips-0988cacad01b38a18a47bac14a0695f246bc76c1b06c0eeb8eb0dc825ab0c8e0-bd3a4966912eb8b30ed0d00b0cda6b6543b949d5ffe00bea54c04c81e1561d88
    - name: Fetch platform-35 r02 and build-tools 35.0.0 (each checked against its sha256)
      shell: bash
      run: |
        zips="$RUNNER_TEMP/android-zips"
        mkdir -p "$zips"
        [ -f "$zips/platform.zip" ] || curl -sSfL https://dl.google.com/android/repository/platform-35_r02.zip -o "$zips/platform.zip"
        [ -f "$zips/build-tools.zip" ] || curl -sSfL https://dl.google.com/android/repository/build-tools_r35_linux.zip -o "$zips/build-tools.zip"
        # The reviewed bytes, the Dockerfile's pins: a changed zip fails here, cached or fetched.
        printf '%s  %s\n' \
          0988cacad01b38a18a47bac14a0695f246bc76c1b06c0eeb8eb0dc825ab0c8e0 "$zips/platform.zip" \
          bd3a4966912eb8b30ed0d00b0cda6b6543b949d5ffe00bea54c04c81e1561d88 "$zips/build-tools.zip" \
          | sha256sum --check --strict
    - name: Lay out the SDK files phoned's build reads
      shell: bash
      run: |
        zips="$RUNNER_TEMP/android-zips"
        sdk="$RUNNER_TEMP/android-sdk"
        x="$RUNNER_TEMP/android-x"
        mkdir -p "$x" "$sdk/platforms" "$sdk/build-tools/35.0.0/lib"
        cd "$x"
        "$JAVA_HOME/bin/jar" xf "$zips/platform.zip" android-35/android.jar android-35/core-for-system-modules.jar
        "$JAVA_HOME/bin/jar" xf "$zips/build-tools.zip" android-15/lib/d8.jar
        mv android-35 "$sdk/platforms/android-35"
        mv android-15/lib/d8.jar "$sdk/build-tools/35.0.0/lib/d8.jar"
        echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
