name: Computerd (macOS)

# Computerd.app, the macOS driver (packages/computer/daemon-macos): built, unit-tested, bundled and signed ad hoc, then
# started the way its LaunchAgent is (launchd, in the runner's Aqua session) and smoke-tested through its own computerd
# command. The runner's grants are seeded first (scripts/seed-tcc.sh, which works only because the runner's SIP is
# off); the smoke test reports what works with them in the job summary. The core also builds and tests on Linux.
# Not a required check.

on:
  pull_request:
    paths:
      - 'packages/computer/daemon-macos/**'
      - 'spec/computer/schema/**'
      - '.github/workflows/computer-macos.yml'
  push:
    branches: [main]
    paths:
      - 'packages/computer/daemon-macos/**'
      - 'spec/computer/schema/**'
      - '.github/workflows/computer-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: computer-macos-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: build, test and smoke (macos-26)
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        # bash by name runs with pipefail, so `swift test | tee` fails when a test does.
        shell: bash
        working-directory: packages/computer/daemon-macos
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          echo "runner image ${ImageOS:-?} ${ImageVersion:-?}"
          sw_vers
          swift --version
          xcodebuild -version
      # One build of every target and the tests; -continue-building-after-errors reports every error in one run.
      - name: Build
        run: swift build --build-tests -Xswiftc -continue-building-after-errors 2>&1 | tee build.log
      - name: Unit tests
        run: swift test --skip-build 2>&1 | tee test.log
      # The steps below run even when a unit test failed, so one red test does not hide the smoke test's report.
      - name: Bundle Computerd.app and the ui fixture (ad hoc)
        if: ${{ !cancelled() }}
        run: |
          COMPUTERD_UI_FIXTURE=1 scripts/bundle.sh build
          cp -R build/UIFixture.app /Applications/
      # The ui conformance cases run from packages/computer's build, against the app the smoke step starts.
      - uses: actions/setup-node@v4
        if: ${{ !cancelled() }}
        with:
          node-version: '24.22.3'
          cache: npm
      - name: Build packages/computer
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          npm install --global npm@11.21.0 --ignore-scripts
          node scripts/npm-ci-retry.mjs --ignore-scripts
          npm run build -w @parcha/agentrun-computer
      - name: Seed the runner's grants
        if: ${{ !cancelled() }}
        run: scripts/seed-tcc.sh build/Computerd.app
      - name: Peer check and the conformance cases
        if: ${{ !cancelled() }}
        run: scripts/smoke.sh build/Computerd.app
      - name: Probe (temporary) the capture approvals and the windows on screen
        if: ${{ !cancelled() }}
        run: |
          plutil -p "$HOME/Library/Group Containers/group.com.apple.replayd/ScreenCaptureApprovals.plist" || true
          osascript -l JavaScript -e 'ObjC.import("CoreGraphics"); const l = ObjC.deepUnwrap(ObjC.castRefToObject($.CGWindowListCopyWindowInfo($.kCGWindowListOptionOnScreenOnly, 0))); l.map(w => [w.kCGWindowOwnerName, w.kCGWindowName || "", w.kCGWindowLayer, w.kCGWindowAlpha, JSON.stringify(w.kCGWindowBounds)].join(" | ")).join("\n")'
      - name: Logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: computerd-macos-logs
          path: |
            packages/computer/daemon-macos/test.log
            packages/computer/daemon-macos/build.log
            /tmp/computerd-ci/ui-conformance.json
            /tmp/computerd-ci/stderr.log
            /tmp/computerd-ci/demos/
            ~/Library/Logs/Computerd.log
          if-no-files-found: ignore
          retention-days: 7

  linux:
    name: core on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: swift:6.2-noble
    defaults:
      run:
        working-directory: packages/computer/daemon-macos
    steps:
      - uses: actions/checkout@v4
      - run: swift build --build-tests
      - run: swift test --skip-build
