name: Computerd (macOS)

# Computerd.app, the macOS driver (packages/computer/daemon-macos): built, unit-tested, bundled and signed ad hoc, then
# started the way its LaunchAgent is (launchd, in the runner's Aqua session) and smoke-tested through its own computerd
# command. The runner's grants are seeded first (scripts/seed-tcc.sh, which works only because the runner's SIP is
# off); the smoke test reports what works with them in the job summary. The core also builds and tests on Linux.
# Not a required check.

on:
  pull_request:
    paths:
      - 'packages/computer/daemon-macos/**'
      - 'spec/computer/**'
      - '.github/workflows/computer-macos.yml'
  push:
    branches: [main]
    paths:
      - 'packages/computer/daemon-macos/**'
      - 'spec/computer/**'
      - '.github/workflows/computer-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: computer-macos-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: build, test and smoke (macos-26)
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        # bash by name runs with pipefail, so `swift test | tee` fails when a test does.
        shell: bash
        working-directory: packages/computer/daemon-macos
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version
      - name: Build
        run: swift build --build-tests
      - name: Unit tests
        run: swift test --skip-build 2>&1 | tee test.log
      # The steps below run even when a unit test failed, so one red test does not hide the smoke test's report.
      - name: Bundle Computerd.app (ad hoc)
        if: ${{ !cancelled() }}
        run: scripts/bundle.sh build
      - name: Seed the runner's grants
        if: ${{ !cancelled() }}
        run: scripts/seed-tcc.sh build/Computerd.app
      - name: Smoke test
        if: ${{ !cancelled() }}
        run: scripts/smoke.sh build/Computerd.app
      - name: Logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: computerd-macos-logs
          path: |
            packages/computer/daemon-macos/test.log
            /tmp/computerd-ci/stderr.log
            ~/Library/Logs/Computerd.log
          if-no-files-found: ignore

  linux:
    name: core on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.2-noble
    defaults:
      run:
        working-directory: packages/computer/daemon-macos
    steps:
      - uses: actions/checkout@v4
      - run: swift build --build-tests
      - run: swift test --skip-build
