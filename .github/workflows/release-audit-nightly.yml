name: Release audit nightly

# The release's package verification (scripts/verify-packages.mjs: the packed packages in a clean consumer, and the
# consumer's production audit) on main's tip every night. npm audit reads the live advisory database, so a new high or
# critical advisory turns this run red the morning after it is published, not in the middle of a release.
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
          cache: pnpm
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      # @parcha/agentrun-computer publishes the daemon, dist/computerd-linux-amd64 and -arm64, which Go builds;
      # verify-packages stops without them, before the audit.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: packages/computer/daemon/go.mod
          cache: false
      - run: pnpm --filter @parcha/agentrun-computer run build:daemon
      - run: node scripts/verify-packages.mjs
      - name: Keep the audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-audit-${{ github.run_id }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: ignore
