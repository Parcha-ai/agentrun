name: Star notifications

on:
  watch:
    types: [started]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      verify_discord:
        description: Verify both Discord channels without posting (otherwise test Slack)
        type: boolean
        default: false

# The event payload supplies all repository details; no checkout or GitHub token is needed.
permissions: {}

jobs:
  notify:
    if: github.repository == 'Parcha-ai/agentrun' && (github.event_name == 'watch' || (github.event_name == 'workflow_dispatch' && !inputs.verify_discord))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send Slack notification
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_STARS_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ vars.SLACK_STARS_CHANNEL }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ.get("SLACK_BOT_TOKEN", "").strip()
          channel = os.environ.get("SLACK_CHANNEL", "").strip()
          if not token or not channel:
              raise SystemExit("Configure SLACK_STARS_BOT_TOKEN and SLACK_STARS_CHANNEL first.")

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
              event = json.load(source)
          repository = event["repository"]
          name = repository["full_name"]
          repo_link = "https://github.com/" + name
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              text = (
                  ":white_check_mark: Slack delivery test for "
                  f"<{repo_link}|{name}> star notifications. "
                  "This is a setup test; no GitHub star was added."
              )
          elif os.environ["GITHUB_EVENT_NAME"] == "watch" and event.get("action") == "started":
              login = event["sender"]["login"]
              count = repository["stargazers_count"]
              text = (
                  f":star: <https://github.com/{login}|{login}> starred "
                  f"<{repo_link}|{name}>!\n*{count:,} stars*"
              )
          else:
              raise SystemExit("Only new stars and explicit setup tests send notifications.")

          payload = json.dumps({
              "channel": channel,
              "text": text,
              "unfurl_links": False,
              "unfurl_media": False,
          }).encode("utf-8")
          request = urllib.request.Request(
              "https://slack.com/api/chat.postMessage",
              data=payload,
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json; charset=utf-8",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Slack returned HTTP {error.code}.") from None
          except urllib.error.URLError:
              raise SystemExit("Slack could not be reached; check delivery before retrying.") from None
          if not result.get("ok"):
              raise SystemExit("Slack rejected the notification: " + result.get("error", "unknown_error"))
          print("Slack notification sent.")
          PY

  discord-stars:
    if: github.repository == 'Parcha-ai/agentrun' && github.event.repository.private == false && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: discord-star-milestones
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
      - name: Announce a new milestone in Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_MILESTONES_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/discord-community.mjs stars

  verify-discord:
    if: github.repository == 'Parcha-ai/agentrun' && github.event_name == 'workflow_dispatch' && inputs.verify_discord
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
      - name: Verify release notes webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
        run: node scripts/discord-community.mjs verify 1571650135124086984 1574867068237381722
      - name: Verify announcements webhook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_MILESTONES_WEBHOOK_URL }}
        run: node scripts/discord-community.mjs verify 1571650135124086984 1571660164313129071
