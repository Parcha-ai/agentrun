name: pi-durable-disk live

# pi-durable-disk's live suites against a real Archil scratch disk, once a day and on demand: the claim, its fence and
# takeover, the env, the run, the store, the supervisor and the lifecycle, then the Docker host driver with parking. No
# pull request runs it, and it never runs in a fork. The steps are in packages/pi-durable-disk/test/live/ci.ts.
#
# Repository secrets: ARCHIL_API_KEY (a key of the account that owns the scratch disk), ARCHIL_SCRATCH_DISK (the disk's
# id, dsk-...) and ARCHIL_SCRATCH_REGION (its region; aws-us-east-1 when unset). Use a disk that holds nothing else:
# the suites create and delete run directories and token users on it.
on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One run at a time: two runs would share the scratch disk. A run that is waiting is never cancelled.
concurrency:
  group: pi-durable-disk-live
  cancel-in-progress: false

jobs:
  host:
    if: github.repository == 'Parcha-ai/agentrun'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: packages/pi-durable-disk
    env:
      ARCHIL_API_KEY: ${{ secrets.ARCHIL_API_KEY }}
      ARCHIL_SCRATCH_DISK: ${{ secrets.ARCHIL_SCRATCH_DISK }}
      ARCHIL_SCRATCH_REGION: ${{ secrets.ARCHIL_SCRATCH_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Where the suites record what they create
        run: echo "PDA_STATE_DIR=$RUNNER_TEMP/pda-live-state" >> "$GITHUB_ENV"
      - name: Refuse to start without the scratch disk's secrets
        run: node test/live/ci.ts preflight
      - name: Install the archil client (pinned, checked by hash)
        env:
          ARCHIL_VERSION: 0.8.42-1790378297
          ARCHIL_SHA256: ee593dde01f1c2cbd4ff9cba7852aa87b45f58b97dc328e66e03ced98d9c60d3
        run: |
          test -e /dev/fuse
          curl -fsSL -o "$RUNNER_TEMP/archil.deb" "https://s3.amazonaws.com/archil-client/pkg/archil_${ARCHIL_VERSION}_amd64.deb"
          echo "$ARCHIL_SHA256  $RUNNER_TEMP/archil.deb" | sha256sum -c -
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends fuse3 "$RUNNER_TEMP/archil.deb"
          archil --version | head -1
      - run: npm ci --ignore-scripts
        working-directory: .
      - run: npm run build
      - name: Run the live suites
        timeout-minutes: 100
        run: node test/live/ci.ts suites claim env run store supervise lifecycle
      - name: Remove what a cut suite left on the disk
        if: always()
        timeout-minutes: 10
        run: node test/live/ci.ts sweep
      - name: Summary
        if: always()
        run: node test/live/ci.ts summary >> "$GITHUB_STEP_SUMMARY"

  docker:
    # After the host suites, so the two never share the disk. It runs instances in containers that mount FUSE inside;
    # until it has passed on GitHub's runners it reports without failing the run.
    needs: host
    if: always() && github.repository == 'Parcha-ai/agentrun'
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: packages/pi-durable-disk
    env:
      ARCHIL_API_KEY: ${{ secrets.ARCHIL_API_KEY }}
      ARCHIL_SCRATCH_DISK: ${{ secrets.ARCHIL_SCRATCH_DISK }}
      ARCHIL_SCRATCH_REGION: ${{ secrets.ARCHIL_SCRATCH_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Where the suites record what they create
        run: echo "PDA_STATE_DIR=$RUNNER_TEMP/pda-live-state" >> "$GITHUB_ENV"
      - name: Refuse to start without the scratch disk's secrets
        run: node test/live/ci.ts preflight
      - run: npm ci --ignore-scripts
        working-directory: .
      - run: npm run build
      - name: Build the package's image
        run: |
          rm -f docker/package/*.tgz
          npm pack --pack-destination docker/package
          docker build -f docker/Dockerfile -t pi-durable-disk:local .
      - name: Run the Docker suites (kill, freeze and takeover; parking)
        timeout-minutes: 60
        run: node test/live/ci.ts suites docker
      - name: Remove what a cut suite left on the disk
        if: always()
        timeout-minutes: 10
        run: node test/live/ci.ts sweep
      - name: Summary
        if: always()
        run: node test/live/ci.ts summary >> "$GITHUB_STEP_SUMMARY"
