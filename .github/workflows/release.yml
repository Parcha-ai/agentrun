name: Publish verified beta

# Ordinary pushes, PRs and tags never publish. Configure each package's npm
# trusted publisher for Parcha-ai/agentrun, release.yml, environment npm-release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Reviewed beta tag; also select this tag as the workflow dispatch ref'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-beta-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Parcha-ai/agentrun' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: npm-release
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate requested tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Match the checkout to the provenance commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.21.0 --ignore-scripts
      - name: The tagged commit passed CI on main
        # The merge queue ran every suite on this tree and ci.yml ran again on the commit when it reached main. The release
        # trusts that run's verify gates instead of running the suites a third time; scripts/release-ci-gate.mjs stops the release
        # unless they all passed. The checks below build the archives the release publishes, and still run.
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-ci-gate.mjs
      - name: Build the console (apps/console, its own lockfile), which serve's build copies into its dist
        run: npm ci --ignore-scripts --prefix apps/console && npm run build --prefix apps/console
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/generate-author-contract.mjs --check
      - run: node scripts/check-typescript-floor.mjs
      - run: node scripts/generate-schema.mjs --check
      - run: npm run export:source
      - run: node scripts/check-generated.mjs
      - run: npm run verify:packages
        env:
          AGENTRUN_REQUIRE_CONSOLE: '1'
      - run: npm run verify:source
      - run: node scripts/release-preflight.mjs --tag "$RELEASE_TAG"
      - name: Publish exact verified archives in dependency order
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          # The publish set is scripts/release-preflight.mjs's `releasePackages`: the named packages except a held one (a package whose
          # manifest says "private": true), so lifting a hold changes one flag and no list. It is read into a variable first: errexit
          # does not apply to a command substitution in a for-list, so a failed import there would run the loop zero times and pass.
          packages="$(node --input-type=module -e "import { releasePackages } from './scripts/release-preflight.mjs'; console.log(releasePackages.join(' '))")"
          [ -n "$packages" ] || { echo 'empty publish set' >&2; exit 1; }
          # The publish set in dependency layers (release-preflight.mjs's `releaseLayers`), one layer per line. Each layer is published,
          # then every package of it waits for the registry and is verified at once; a failure there stops the release before the
          # next layer, so no package is published before the packages it depends on are verified.
          layers="$(node --input-type=module -e "import { releaseLayers } from './scripts/release-preflight.mjs'; for (const layer of releaseLayers(process.argv[1].split(' '))) console.log(layer.join(' '))" "$packages")"
          [ -n "$layers" ] || { echo 'empty layer set' >&2; exit 1; }
          while read -r layer; do
            published=()
            publish_failed=''
            for package in $layer; do
              if node scripts/verify-published.mjs --package "$package" --allow-absent; then
                echo "Verified existing $package@$version; resuming without republishing."
                continue
              else
                status=$?
                if [ "$status" -ne 3 ]; then exit "$status"; fi
              fi
              # Exit 3 means an authoritative registry 404. Unknown failures and
              # mismatched published bytes stop the release; they never publish.
              archive="$(node -p 'JSON.parse(require("node:fs").readFileSync(".release/release-plan.json", "utf8")).packages.find(entry => entry.directory === process.argv[1]).filename' "$package")"
              # Published as latest: npm's package page shows the README of the publish that carried the latest tag, and moving
              # latest later with dist-tag carries no README. A maintainer moves beta to the same version afterwards.
              # A failed publish stops the layer, but the packages it already published are still verified below, so their
              # receipts say what the registry holds; the release then stops before the next layer.
              if ! npm publish ".release/packages/$archive" --ignore-scripts --access public --tag latest --provenance --registry=https://registry.npmjs.org/; then
                publish_failed="$package"
                break
              fi
              published+=("$package")
            done
            # Each verification writes its own receipt (.release/published-<package>.json), so they run side by side.
            pids=()
            for package in "${published[@]}"; do
              node scripts/verify-published.mjs --package "$package" &
              pids+=("$!")
            done
            failed=0
            for pid in "${pids[@]}"; do wait "$pid" || failed=1; done
            [ -z "$publish_failed" ] || { echo "publishing $publish_failed failed; the packages this layer published before it were verified, later layers were not published" >&2; exit 1; }
            [ "$failed" -eq 0 ] || { echo "a package of the layer '$layer' failed verification; later layers were not published" >&2; exit 1; }
          done <<< "$layers"
      - name: Verify a fresh installation from the registry
        run: node scripts/verify-published.mjs --package all
      - name: Retain exact release archives and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-release-${{ github.run_id }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: ignore

  # AgentRun Server's container image, built from the same reviewed tag once the packages are published and verified.
  # It runs only after the approved publish job and pushes with this run's GITHUB_TOKEN, so it needs no environment.
  # Every action is pinned by commit, and the images buildx runs (binfmt for QEMU, BuildKit) by digest.
  image:
    needs: publish
    if: github.repository == 'Parcha-ai/agentrun' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/parcha-ai/agentrun-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Match the checkout to the provenance commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          cache-image: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=docker.io/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packages/serve/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag }}
            ${{ env.IMAGE }}:beta
