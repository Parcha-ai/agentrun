name: Publish verified beta

# Ordinary pushes, PRs and tags never publish. Configure each package's npm
# trusted publisher for Parcha-ai/agentrun, release.yml, environment npm-release,
# and parcha-agentrun's PyPI trusted publisher with the same three.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Reviewed beta tag; also select this tag as the workflow dispatch ref'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-beta-release
  cancel-in-progress: false

jobs:
  # The release's preconditions, checked once before anything else starts: the tag is a reviewed beta tag, the run was
  # dispatched at it, and the tagged commit passed CI on main. Every other job needs it, so the jobs the npm-release
  # approval holds (publish, pypi, box) all ask for it at the same moment and one approval covers them.
  gate:
    if: github.repository == 'Parcha-ai/agentrun' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate requested tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Match the checkout to the provenance commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
      - name: The tagged commit passed CI on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-ci-gate.mjs

  publish:
    needs: gate
    if: github.repository == 'Parcha-ai/agentrun' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: npm-release
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate requested tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Match the checkout to the provenance commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.21.0 --ignore-scripts
      - name: The tagged commit passed CI on main
        # The merge queue ran every suite on this tree and ci.yml ran again on the commit when it reached main. The release
        # trusts that run's verify gate instead of running the suites a third time; scripts/release-ci-gate.mjs stops the release
        # unless it passed. The checks below build the archives the release publishes, and still run.
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-ci-gate.mjs
      - name: Fold the fragments the tag carries into this version
        # A pull request that merged after the release pull request's fold, and before the tag, left its changes/ fragment at the tag;
        # its code is in this release. The fold puts those into this version's sections, uncommitted, before anything is built or
        # packed, so the published changelogs list everything the archives ship. release-preflight checks the tree is the tag plus
        # this fold. The next release pull request's fold moves them into this version's section on main (docs/releasing.md).
        run: node scripts/changes.mjs --fold "${RELEASE_TAG#v}"
      - run: npm ci --ignore-scripts
      - run: npm run build
      # @parcha/agentrun-computer publishes the daemon, dist/computerd-linux-amd64 and -arm64, which Go builds;
      # verify:packages stops the release without them. Pinned by commit: this job holds the npm OIDC token.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: packages/computer/daemon/go.mod
          cache: false
      - run: npm run build:daemon -w @parcha/agentrun-computer
      - run: node scripts/generate-author-contract.mjs --check
      - run: node scripts/check-typescript-floor.mjs
      - run: node scripts/generate-schema.mjs --check
      - run: npm run export:source
      - run: node scripts/check-generated.mjs
      # --console: a server archive without the console and its notices stops the release.
      - run: npm run verify:packages -- --console
      - run: npm run verify:source
      - run: node scripts/release-preflight.mjs --tag "$RELEASE_TAG"
      - name: Publish exact verified archives in dependency order
        shell: bash
        run: |
          set -euo pipefail
          # The publish set is scripts/release-preflight.mjs's `releasePackages`: the named packages except a held one (a package whose
          # manifest says "private": true), so lifting a hold changes one flag and no list. It is read into a variable first: errexit
          # does not apply to a command substitution in a for-list, so a failed import there would run the loop zero times and pass.
          packages="$(node --input-type=module -e "import { releasePackages } from './scripts/release-preflight.mjs'; console.log(releasePackages.join(' '))")"
          [ -n "$packages" ] || { echo 'empty publish set' >&2; exit 1; }
          # Every layer is published in dependency order (release-preflight.mjs's `releaseLayers`, one layer per line), back to
          # back: npm accepts a package whose dependencies it does not show yet. Then every package published waits for the
          # registry and is verified at once, so the release waits once, as long as its slowest package, not once per layer.
          # A probe that is not an authoritative 404, or a failed publish, stops publishing there; what was published before it
          # is still verified, so its receipts say what the registry holds, and the step fails.
          published=()
          stopped=''
          layers="$(node --input-type=module -e "import { releaseLayers } from './scripts/release-preflight.mjs'; for (const layer of releaseLayers(process.argv[1].split(' '))) console.log(layer.join(' '))" "$packages")"
          [ -n "$layers" ] || { echo 'empty layer set' >&2; exit 1; }
          while read -r layer; do
            for package in $layer; do
              if node scripts/verify-published.mjs --package "$package" --allow-absent; then
                echo "Verified existing $package at its planned version; resuming without republishing."
                continue
              else
                status=$?
                if [ "$status" -ne 3 ]; then
                  stopped="the registry check of $package stopped the release (exit $status)"
                  break 2
                fi
              fi
              # Exit 3 means an authoritative registry 404. Unknown failures and
              # mismatched published bytes stop the release; they never publish.
              archive="$(node -p 'JSON.parse(require("node:fs").readFileSync(".release/release-plan.json", "utf8")).packages.find(entry => entry.directory === process.argv[1]).filename' "$package")"
              # Published as latest: npm's package page shows the README of the publish that carried the latest tag, and moving
              # latest later with dist-tag carries no README.
              if ! npm publish ".release/packages/$archive" --ignore-scripts --access public --tag latest --provenance --registry=https://registry.npmjs.org/; then
                status=1
                stopped="publishing $package failed"
                break 2
              fi
              published+=("$package")
            done
          done <<< "$layers"
          # Each verification writes its own receipt (.release/published-<package>.json), so they run side by side.
          pids=()
          for package in "${published[@]}"; do
            node scripts/verify-published.mjs --package "$package" &
            pids+=("$!")
          done
          bad=()
          for index in "${!pids[@]}"; do wait "${pids[$index]}" || bad+=("${published[$index]}"); done
          [ -z "$stopped" ] || { echo "$stopped; the packages published before it were verified, nothing after it was published" >&2; exit "$status"; }
          [ "${#bad[@]}" -eq 0 ] || { echo "a published package failed verification against the registry: ${bad[*]}" >&2; exit 1; }
      - name: Verify a fresh installation from the registry
        run: node scripts/verify-published.mjs --package all
      - name: Retain exact release archives and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-release-${{ github.run_id }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: ignore

  # The Python client, parcha-agentrun (python/), on its own version line (python/pyproject.toml; docs/releasing.md), published to
  # PyPI from the same reviewed tag, beside the npm packages: it depends on none of them, and waiting for them would ask for the
  # npm-release approval a second time. PyPI trusted publishing: no token or secret, only this job's OIDC token, so every action is
  # pinned by commit. A version already on PyPI is not published again.
  pypi:
    needs: gate
    if: github.repository == 'Parcha-ai/agentrun' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Match the checkout to the provenance commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check build==1.6.1 twine==7.0.0
      - name: Build the sdist and wheel
        run: python -m build --sdist --wheel --outdir "$RUNNER_TEMP/python-dist" python
      # The project, the archives against this tree's python/ file for file, twine check, and a clean venv's offline smoke.
      - run: node scripts/python-release.mjs --verify "$RUNNER_TEMP/python-dist" --python python
      # On PyPI already: skipped only when its wheel is this build's agentrun/, byte for byte; other contents stop the job.
      - name: Is this version on PyPI already?
        id: pypi
        run: node scripts/python-release.mjs --on-pypi "$RUNNER_TEMP/python-dist" --python python
      - if: steps.pypi.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: ${{ runner.temp }}/python-dist
      # The plan and the exact archives, kept as the publish job keeps its evidence (the repository's retention).
      - name: Retain the Python archives and plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-release-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/python-dist
            .release/python-plan.json
          if-no-files-found: ignore
          include-hidden-files: true

  # AgentRun Server's container image, built from the same reviewed tag (packages/serve/docker/Dockerfile) for linux/amd64 and
  # linux/arm64, each on its own native runner: under QEMU the arm64 build took over half an hour. The image builds from the
  # checkout and never reads npm, so it starts with the run, before the approval, and pushes each build by its digest alone;
  # image-release tags them once the approved publish job passes, so nothing is tagged for a release that did not publish.
  # It pushes with this run's GITHUB_TOKEN, so it needs no environment. Every action is pinned by commit, and BuildKit by digest.
  image:
    needs: gate
    if: github.repository == 'Parcha-ai/agentrun' && github.event.repository.private == false
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/parcha-ai/agentrun-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Match the checkout to the provenance commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=docker.io/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: packages/serve/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Keep the build's digest for image-release
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::the build gave '$DIGEST', not an image digest" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tags the two builds as one image, ghcr.io/parcha-ai/agentrun-server:<tag> and :beta, once the approved publish job has
  # published and verified the packages. A manifest list over the two digests, each with its SBOM and max provenance: seconds.
  image-release:
    needs: [publish, image]
    if: github.repository == 'Parcha-ai/agentrun' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/parcha-ai/agentrun-server
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=docker.io/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the release from the two digests
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -- *
          [ "$#" -eq 2 ] || { echo "::error::expected the amd64 and arm64 digests, found $#: $*" >&2; exit 1; }
          refs=()
          for digest in "$@"; do refs+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create --tag "$IMAGE:$RELEASE_TAG" --tag "$IMAGE:beta" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG"

  # The box image (packages/computer/box): what a remote computer with an Archil mount starts from, published once per
  # recipe as ghcr.io/parcha-ai/agentrun-box:<recipe hash> (box/recipe.mjs recipeHash) and tagged with the release, for
  # linux/amd64; then the public E2B template agentrun-archil-<recipe hash>, built from that image, so an owner's E2B team
  # starts from it with nothing built. One job under the npm-release approval, beside publish: it reads E2B_API_KEY, the
  # environment's only secret it needs, and a second job under the approval would ask for it again. It depends on no npm
  # package; a recipe image is keyed by its hash, so publishing it for a tag whose npm publish then fails is harmless.
  # Every action is pinned by commit and BuildKit by digest. Its context is box/, which the npm package ships whole; the image
  # copies the helper alone from it, and the build takes no secret.
  box:
    needs: gate
    if: github.repository == 'Parcha-ai/agentrun' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-release
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/parcha-ai/agentrun-box
      RELEASE_TAG: ${{ inputs.tag }}
    outputs:
      recipe: ${{ steps.recipe.outputs.hash }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Match the checkout to the provenance commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'
      - name: The recipe's hash
        id: recipe
        run: |
          hash="$(node --input-type=module -e "import { recipeHash } from './packages/computer/box/recipe.mjs'; console.log(recipeHash())")"
          [[ "$hash" =~ ^[0-9a-f]{12}$ ]] || { echo "box/recipe.mjs printed '$hash', not a recipe hash" >&2; exit 1; }
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver-opts: image=docker.io/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A recipe is built once: a release whose recipe is published already tags that image, and the recipe's tag keeps
      # its digest (a rebuild could differ: apt's packages are not pinned). Only the registry's "not found" builds it; any
      # other failed read stops the job.
      - name: Is this recipe published already?
        id: published
        env:
          RECIPE: ${{ steps.recipe.outputs.hash }}
        run: |
          if read_error="$(docker buildx imagetools inspect "$IMAGE:$RECIPE" 2>&1 >/dev/null)"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$RECIPE is published already: tagging it $RELEASE_TAG"
          elif [[ "$read_error" == *": not found"* ]]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::reading $IMAGE:$RECIPE failed, so whether it is published is unknown: $read_error" >&2
            exit 1
          fi
      - if: steps.published.outputs.published != 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: packages/computer/box
          file: packages/computer/box/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.recipe.outputs.hash }}
            ${{ env.IMAGE }}:${{ inputs.tag }}
      - if: steps.published.outputs.published == 'true'
        name: Tag the published recipe with the release
        env:
          RECIPE: ${{ steps.recipe.outputs.hash }}
        run: docker buildx imagetools create --tag "$IMAGE:$RELEASE_TAG" "$IMAGE:$RECIPE"
      # The E2B template. Without the key it stops here, saying so, with the box image published.
      - name: The npm-release environment has the E2B key
        env:
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: |
          [ -n "$E2B_API_KEY" ] || { echo "::error::needs secret E2B_API_KEY in the npm-release environment: the key of the E2B team the public template agentrun-archil-<recipe> is built in" >&2; exit 1; }
      # E2B pulls the image with no credentials, so a private package stops the job before the build.
      - name: The image is public
        env:
          BOX_IMAGE: ${{ env.IMAGE }}:${{ steps.recipe.outputs.hash }}
        run: |
          repo="${BOX_IMAGE#ghcr.io/}"; repo="${repo%:*}"
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:$repo:pull" | node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>console.log(JSON.parse(s).token))')" || token=''
          code="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' "https://ghcr.io/v2/$repo/manifests/${BOX_IMAGE##*:}")"
          [ "$code" = 200 ] || { echo "::error::$BOX_IMAGE can't be pulled with no credentials (HTTP $code): the package is private. An org admin makes ghcr.io/$repo public once, in the package's settings, then re-runs this job" >&2; exit 1; }
      - run: npm ci --ignore-scripts
      - name: Build the template from the image and make it public
        env:
          BOX_IMAGE: ${{ env.IMAGE }}:${{ steps.recipe.outputs.hash }}
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
        run: node packages/computer/box/build-e2b.mjs --image "$BOX_IMAGE" --public
