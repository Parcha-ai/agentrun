name: Package checks

on:
  # A branch with a pull request runs on pull_request; a push run of the same commit was a second copy of every job.
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

# Reaches every npm and npx in every job, nested ones too unless a script clears the env. A registry request that fails
# before its response arrives (reset, refused, timed out, 5xx) is retried 5 times, 20 s then 2 min apart (~8 min), not
# npm's 2 in ~70 s. npm never retries a download that drops midway: each `npm ci` (scripts/npm-ci-retry.mjs, also used
# by scripts/build-console.mjs) retries once on a network error only.
env:
  npm_config_fetch_retries: '5'
  npm_config_fetch_retry_mintimeout: '20000'
  npm_config_fetch_retry_maxtimeout: '120000'

# A new push to a pull request replaces its running checks. Merge-queue candidates and main keep every run: each head
# needs its own verdict. So does the cutover branch's pull request: many lanes land on it in turn, and each push keeps
# its own run (grouped by its commit, never cancelled), so every head gets a complete result.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref == 'untangle/cutover' && github.sha || (github.event.pull_request.number || github.event.merge_group.head_sha || github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'untangle/cutover' }}

jobs:
  build:
    # `npm run build` (the console first: the server's build copies it in) once per Node version the test jobs run, its
    # output packed for every job that tests it (scripts/ci-build-output.mjs): each workspace's dist and the console's,
    # about 10 MB. Those jobs still run their own `npm ci`: node_modules is 1.3 GB, and npm's cache restores it in about
    # 10 s, faster than an artifact of that size moves. Each refuses an output built from another tree or on another Node.
    name: build (${{ matrix.node }})
    # Blacksmith in the merge queue, as the test shards that wait for it.
    runs-on: ${{ github.event_name == 'merge_group' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(github.event_name == 'merge_group' && '["24.21.0"]' || '["24.11.0","24.21.0"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/console/package-lock.json
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - run: node scripts/npm-ci-retry.mjs --ignore-scripts
      - run: npm run build
      # @parcha/agentrun-computer publishes the daemon, dist/computerd-linux-amd64 and -arm64, which Go builds: in the
      # output the test jobs unpack, so the packages shard's verify-packages finds them, as the release's does.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: packages/computer/daemon/go.mod
          cache: false
      - run: npm run build:daemon -w @parcha/agentrun-computer
      - name: Pack what the build wrote
        run: node scripts/ci-build-output.mjs pack "$RUNNER_TEMP/build"
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.node }}
          path: ${{ runner.temp }}/build
          if-no-files-found: error
          retention-days: 3
          # A re-run of this job replaces its output instead of failing on the name.
          overwrite: true

  test:
    # The checks and suites `verify` gates, in jobs that run at once on the build job's output. `checks` keeps the
    # generated-file and type checks and the version-specific steps; `packages` and `source` are the two package
    # consumers, which took 2 and 2.5 min one after the other in `checks`. The rest are test shards
    # (scripts/ci-shard.mjs): each suite's files assigned by time to the shards of its pool (scripts/ci-shards.json), and
    # every shard job fails unless the shards cover every test file once, so a new package or test file is tested without
    # an edit here. A shard's name is its pool and number; the pools' counts there and the list below must agree
    # (scripts/ci-plan.test.mjs).
    name: test (${{ matrix.node }}, ${{ matrix.shard }})
    needs: [build]
    # Merge-queue candidates run on Blacksmith (shards took 127 to 227 s there, 230 to 390 s here); pull requests, forks
    # included, stay on GitHub's runners. The gh pool stays too: Blacksmith's kernels have no Yama ptrace_scope, so
    # pi-transport's launcher refuses a launch with stdin or secrets there.
    runs-on: ${{ github.event_name == 'merge_group' && !startsWith(matrix.shard, 'gh-') && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 24.11 = the supported floor (first 24 LTS), 24.21 = current. The merge queue runs current only: every pull
        # request and every push to main runs both.
        node: ${{ fromJSON(github.event_name == 'merge_group' && '["24.21.0"]' || '["24.11.0","24.21.0"]') }}
        shard: [checks, packages, source, gh-1, gh-2, lean-1, lean-2, any-1, any-2, any-3, any-4, any-5, any-6]
        # The downloaded source's consumer runs on current only, as it did in `checks`.
        exclude:
          - node: '24.11.0'
            shard: source
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ matrix.shard == 'checks' && '0' || '1' }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Changelog fragments
        if: matrix.shard == 'checks'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/changes.mjs --check --base "$BASE_SHA"
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - name: Install poppler, Ghostscript and ffmpeg
        # agentrun-serve's pdf_pages draws pages with poppler, and its tests make their PDFs with Ghostscript and a wide
        # PNG with ffmpeg: serve's suite runs in the any pool's shards.
        if: startsWith(matrix.shard, 'any-')
        run: |
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils ghostscript ffmpeg
          pdftoppm -v && gs --version && ffmpeg -version | head -1
      - run: node scripts/npm-ci-retry.mjs --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.node }}
          path: ${{ runner.temp }}/build
      - name: The build job's output, for this tree and this Node
        run: node scripts/ci-build-output.mjs unpack "$RUNNER_TEMP/build"
      - if: matrix.shard == 'checks'
        run: npm run typecheck
      - name: undici in this install is at or above its floor
        if: matrix.shard == 'checks'
        run: node scripts/check-undici.mjs
      - name: Imports follow the layer direction
        if: matrix.shard == 'checks'
        run: npm run check:direction
      - if: matrix.shard == 'checks'
        run: node scripts/generate-schema.mjs --check
      - if: matrix.shard == 'checks'
        run: node scripts/generate-clients.mjs --check
      # The source export: checked here, and the archive the downloaded source's consumer installs.
      - if: matrix.shard == 'checks' || matrix.shard == 'source'
        run: npm run export:source
      - if: matrix.shard == 'checks'
        run: node scripts/check-generated.mjs
      # TypeScript 5.4.5, not a Node version: in the merge queue it runs on the one Node there.
      - if: matrix.shard == 'checks' && (matrix.node == '24.11.0' || github.event_name == 'merge_group')
        run: node scripts/check-typescript-floor.mjs
      # verify-packages --console then checks the packed server carries the console, its files scanned like every packed file.
      - if: matrix.shard == 'packages'
        run: node scripts/verify-packages.mjs --console
      - if: matrix.shard == 'source'
        run: npm run verify:source
      - if: matrix.shard != 'checks' && matrix.shard != 'packages' && matrix.shard != 'source'
        run: |
          if [ -n "$LEAN_SWEEP_DIR" ]; then export NODE_OPTIONS="${NODE_OPTIONS:+$NODE_OPTIONS }--import=$GITHUB_WORKSPACE/spec/lean/sweep/capture-register.mjs"; fi
          node scripts/ci-shard.mjs ${{ matrix.shard }}
        env:
          # The Claude Agent adapter's real-CLI test runs on the pinned CLI (the SDK's platform package, a dev dependency):
          # here a missing or different one fails, not skips.
          AGENTRUN_CLAUDE_AGENT_REQUIRE_BINARY: '1'
          # The Codex adapter's tool-off test runs on the pinned binary (a dev dependency): here a missing one fails, not skips.
          AGENTRUN_CODEX_REQUIRE_BINARY: '1'
          # On 24.21.0 the lean pool's shards record every workflow their DSL, pi and example tests validate or run
          # (spec/lean/sweep, preloaded above), for the lean job's validator sweep. Empty elsewhere: no hook.
          LEAN_SWEEP_DIR: ${{ matrix.node == '24.21.0' && startsWith(matrix.shard, 'lean-') && format('{0}/lean-sweep', runner.temp) || '' }}
      # The lean job reads these and fails on a missing one; a shard with none marks this step red, never the shard.
      - name: Keep the workflows the tests validated, for the lean job
        if: matrix.node == '24.21.0' && startsWith(matrix.shard, 'lean-')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lean-sweep-${{ matrix.shard }}
          path: ${{ runner.temp }}/lean-sweep/*.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Retain package verification evidence
        if: always() && (matrix.shard == 'packages' || matrix.shard == 'source')
        uses: actions/upload-artifact@v4
        with:
          name: package-verification-${{ matrix.node }}-${{ matrix.shard }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: ignore

  serve-postgres:
    # @parcha/agentrun-serve's store on Postgres (`npm run test:pg`), against a Postgres service container. Advisory: not
    # in verify's needs nor a required check, until it has run green.
    name: serve store on Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The service container's own throwaway login, made for this job and gone with it; the test's URL is built from
    # these in its step, so no connection string with a password is written anywhere.
    env:
      PGUSER: agentrun
      PGPASSWORD: agentrun
      PGDATABASE: agentrun
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agentrun
          POSTGRES_PASSWORD: agentrun
          POSTGRES_DB: agentrun
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentrun -d agentrun"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - run: node scripts/npm-ci-retry.mjs --ignore-scripts
      - run: npm run build
      - name: The store's suite on Postgres
        run: AGENTRUN_TEST_PG_URL="postgres://${PGUSER}:${PGPASSWORD}@127.0.0.1:5432/${PGDATABASE}" npm run test:pg -w packages/serve

  console:
    # apps/console, the server's console: a private app with its own lockfile (React, Vite, Storybook), outside the
    # workspaces. Its typecheck, tests, build and Storybook build run here; verify needs it like the test shards.
    name: console
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - run: node ../../scripts/npm-ci-retry.mjs --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook

  python-client:
    # parcha-agentrun (python/), the Python client: its generated module is the server's document's, pyright passes it,
    # and its tests pass on the oldest and the newest Python it supports, against loopback servers and the real server
    # with the faux model, from the build job's output (here a server that is not built fails the demo, not skips it).
    name: python-client (${{ matrix.python }})
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - run: node scripts/npm-ci-retry.mjs --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: build-24.21.0
          path: ${{ runner.temp }}/build
      - name: The build job's output, for this tree and this Node
        run: node scripts/ci-build-output.mjs unpack "$RUNNER_TEMP/build"
      - run: node scripts/generate-clients.mjs --check
      - run: npx pyright -p python
      - name: The client's tests
        env:
          AGENTRUN_PYTHON_REQUIRE_SERVER: '1'
        run: python -m unittest discover -s python/tests -v

  verify:
    # The one required check: it passes when every test shard (both Node versions) and the console passed. It reads
    # `needs`, not the jobs API, so an API error cannot fail a required check. `needs.test.result` is the result of
    # every matrix instance of `test`, so a red shard on either Node fails this job.
    name: verify
    needs: [test, console]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every test shard and the console passed
        env:
          RESULT: ${{ needs.test.result }}
          CONSOLE: ${{ needs.console.result }}
        run: test "$RESULT" = success && test "$CONSOLE" = success

  transport-docker:
    # @parcha/pi-transport's formatter and linter, and its box conformance suite on real Docker containers. They are not
    # part of the verify matrix: the suite needs a Docker daemon and an image, not both Node versions. A daemon that
    # cannot start a box fails a test here instead of skipping it. Then serve's boxed tools on the same daemon, advisory
    # (a failure shows, and blocks nothing): a sandbox run's bash and file tools in a box with no network and no key.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - run: node scripts/npm-ci-retry.mjs --ignore-scripts
      - run: npm run lint -w @parcha/pi-transport
      - run: docker pull debian:bookworm-slim
      - run: npm run test:live:docker -w @parcha/pi-transport
      - name: Build, for serve's boxed tools on Docker (advisory)
        continue-on-error: true
        run: npm run build
      - name: Serve's boxed tools on Docker, no network and no key in the box, and the default box image built (advisory)
        continue-on-error: true
        working-directory: packages/serve
        env:
          AGENTRUN_SERVE_LIVE_DOCKER: '1'
          AGENTRUN_SERVE_LIVE_DOCKER_BUILD: '1'
        # The flag bounds the whole file, which builds the default box image (python, git, curl) once.
        run: node --test --test-timeout=900000 test/boxed-tools.docker.test.mjs

  computer-docker:
    # @parcha/agentrun-computer on real Docker: the daemon's vet and Go tests, then the live demo of a command run in a
    # Docker computer. On an x64 and an arm64 runner, so each architecture's daemon runs on its own, not under emulation.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: packages/computer/daemon/go.mod
          cache: false
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - run: node scripts/npm-ci-retry.mjs --ignore-scripts
      - name: The daemon's vet and tests
        working-directory: packages/computer/daemon
        run: go vet ./... && go test ./...
      - run: npm run build -w @parcha/agentrun-computer
      - run: npm run build:daemon -w @parcha/agentrun-computer
      - run: docker pull debian:bookworm-slim
      - run: npm run test:docker -w @parcha/agentrun-computer
        env:
          AGENTRUN_COMPUTER_LIVE_DOCKER: '1'

  deploy-compose:
    # The deploy image and stack (deploy/compose.yaml): the image built from this checkout, a server and two runners
    # from it on one store, and a run of an agent in the runner's place completed on a faux model (no key, no network).
    # Outside the verify matrix: it needs a Docker daemon, not both Node versions. deploy/walk/reclaim.sh, the takeover
    # walk, is run by hand: it takes about three minutes, half of them waiting out a lease.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: The image built, and the stack's smoke
        run: sh deploy/walk/smoke.sh

  real-chrome:
    # @parcha/pi-browser's suites that drive a real local Chrome (the coding agent's default provider, the cdp provider, Stagehand's
    # driver and its trace-export seal). They are not part of the verify matrix: they need one pinned browser, not both Node versions.
    # Chrome for Testing is used because the runner's own Chrome answers Extensions.loadUnpacked with "Method not available", so
    # Stagehand's extension cannot load in it. A missing or incapable Chrome fails a test here instead of skipping it.
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROME_FOR_TESTING: '155.0.8059.39'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/chrome-for-testing
          key: chrome-for-testing-${{ runner.os }}-${{ env.CHROME_FOR_TESTING }}
      - name: Install the pinned Chrome for Testing
        run: |
          installed=$(npx --yes @puppeteer/browsers@3.2.3 install "chrome@${CHROME_FOR_TESTING}" --path "$HOME/chrome-for-testing")
          chrome="${installed#* }"
          echo "CHROME_PATH=${chrome}" >> "$GITHUB_ENV"
          "${chrome}" --version
      - name: Let an unprivileged Chrome start its sandbox
        # Ubuntu 24.04 runners confine unprivileged user namespaces with AppArmor, so Chrome for Testing (unpackaged, no profile)
        # exits with SIGABRT at startup. This is the runner's documented switch; the sandbox stays on for the tests.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - run: node scripts/npm-ci-retry.mjs --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: build-24.21.0
          path: ${{ runner.temp }}/build
      - name: The build job's output, for this tree and this Node
        run: node scripts/ci-build-output.mjs unpack "$RUNNER_TEMP/build"
      - run: npm run test:chrome -w @parcha/pi-browser

  console-e2e:
    # The console's flows in a real browser against the built server (apps/console/e2e): the page loads with the server's own
    # headers, CSP, cookies and redirects, which jsdom never sees. Each flow starts its own server on loopback with a fresh
    # data dir; nothing leaves loopback. The same pinned Chrome for Testing as real-chrome, from the same cache.
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROME_FOR_TESTING: '155.0.8059.39'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/chrome-for-testing
          key: chrome-for-testing-${{ runner.os }}-${{ env.CHROME_FOR_TESTING }}
      - name: Install the pinned Chrome for Testing
        run: |
          installed=$(npx --yes @puppeteer/browsers@3.2.3 install "chrome@${CHROME_FOR_TESTING}" --path "$HOME/chrome-for-testing")
          chrome="${installed#* }"
          echo "CHROME_PATH=${chrome}" >> "$GITHUB_ENV"
          "${chrome}" --version
      - name: Let an unprivileged Chrome start its sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - run: node scripts/npm-ci-retry.mjs --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: build-24.21.0
          path: ${{ runner.temp }}/build
      - name: The build job's output, for this tree and this Node
        run: node scripts/ci-build-output.mjs unpack "$RUNNER_TEMP/build"
      - run: npm run test:e2e

  stranger:
    # A package installed from its packed tarball into an empty directory, with an empty environment and home, runs the one command
    # its README gives with no key (scripts/stranger/<name>.json). Each spec runs on its own runner. A spec that says the package has
    # no such command is reported, not failed.
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        spec: [agentrun-dsl, agentrun-jev, agentrun-pi, pi-durable-disk, pi-browser, pi-transport, pi-transport-docker, pi-durable-agent, agentrun-kernel, agentrun-harness-claude, agentrun-harness-codex, agentrun-serve]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - run: node scripts/npm-ci-retry.mjs --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: build-24.21.0
          path: ${{ runner.temp }}/build
      - name: The build job's output, for this tree and this Node
        run: node scripts/ci-build-output.mjs unpack "$RUNNER_TEMP/build"
      - name: Run the stranger test
        # An explicit shell runs with pipefail; the default does not, and tee's status would hide a failing spec.
        shell: bash
        run: |
          node scripts/stranger.mjs "${{ matrix.spec }}" | tee "$RUNNER_TEMP/stranger.out"
          if grep -q 'no-key path missing' "$RUNNER_TEMP/stranger.out"; then echo "::notice title=${{ matrix.spec }}::$(cat "$RUNNER_TEMP/stranger.out")"; fi

  macos-local-run:
    # A run on a local directory on macOS, which has no /proc and no setpriv: the process table comes from ps and
    # sysctl, the run's root is addressed by its path, the file tools are confined by path, and the store syncs with
    # F_FULLFSYNC. No other job runs on a Mac, so every macOS line of the README stands on this one: the stranger's
    # no-key quickstart, and the local run's tests on the Mac's own ps.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - run: node scripts/npm-ci-retry.mjs --ignore-scripts
      - run: npm run build
      - name: The local run's tests
        working-directory: packages/pi-durable-disk
        run: >-
          node --test --test-timeout=240000
          test/process-table.test.ts test/commands.test.ts test/watchdog.test.ts
          test/local-run.test.ts test/cli-local.test.ts test/quickstart.test.ts test/confine.test.ts
          test/examples/kill-9.test.ts test/examples/audit-across-crashes.test.ts test/examples/no-double-charge.test.ts
          test/examples/fork-into-many.test.ts test/examples/serve-and-park.test.ts
      - name: The server hands a workflow run its decision key
        # macOS aborts the parent of a spawn with a pipe at descriptor 16 or above; a run with a decision key must not.
        working-directory: packages/serve
        run: node --test --test-timeout=240000 test/decision-key.test.mjs
      - name: A run's folder swapped for a link reaches no host file
        # The path-resolving branch every Mac takes (serve's local.ts), on the Mac's own kernel: its opens refuse a link
        # anywhere on the way with O_NOFOLLOW_ANY (beneath.ts), which Linux CI stands in for by a walk through /proc.
        working-directory: packages/serve
        run: node --test --test-timeout=240000 --test-name-pattern="^local, resolving paths" test/workspace-local.test.mjs
      - name: The stranger's no-key quickstart
        # The README's quickstart, then the keyless examples against the registry's latest (#557). On a Mac the walk installs
        # 0.1.0-beta.14 at the least, the first release that runs there (the spec's examples.platformFloors).
        run: node scripts/stranger.mjs pi-durable-disk

  stranger-readme-line:
    # A README's own install line (its spec's readmeInstall), as a stranger types it, against what the registry serves now
    # (--readme-line): `packed` puts this tree's package in the line, so it says whether the next release installs; `registry`
    # runs the line as written, so it says whether the published package installs today. Unlike `stranger`, the peers are not
    # pinned to the developed versions. A mode that is not `blocking` reports a failure as a warning on the run and passes, so
    # a known failure does not turn every pull request red. pi-durable-disk's `packed` blocks; its `registry` warns until the
    # first release on pi 1.5 publishes (the README's line pins pi 1.5.0, and every published beta's peers stop below pi
    # 1.4, so the line as written ends in ERESOLVE until then). Make it blocking then. pi-durable-agent's `packed` blocks;
    # its `registry` warns until its README's line names `@latest`, which the registry serves (0.1.0-beta.28), instead of
    # `@beta`, a tag it has none of for this package. Make it blocking then.
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - spec: pi-durable-disk
            mode: packed
            blocking: true
          - spec: pi-durable-disk
            mode: registry
            blocking: false
          - spec: pi-durable-agent
            mode: packed
            blocking: true
          - spec: pi-durable-agent
            mode: registry
            blocking: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - run: node scripts/npm-ci-retry.mjs --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: build-24.21.0
          path: ${{ runner.temp }}/build
      - name: The build job's output, for this tree and this Node
        run: node scripts/ci-build-output.mjs unpack "$RUNNER_TEMP/build"
      - name: Run the README's install line
        shell: bash
        env:
          SPEC: ${{ matrix.spec }}
          MODE: ${{ matrix.mode }}
          BLOCKING: ${{ matrix.blocking }}
        run: |
          flags=(--readme-line)
          if [ "$MODE" = registry ]; then flags+=(--registry); fi
          out="$RUNNER_TEMP/readme-line.out"
          if node scripts/stranger.mjs "$SPEC" "${flags[@]}" > "$out" 2>&1; then cat "$out"; exit 0; fi
          cat "$out"
          # The first line that says why (npm's ERESOLVE, an assertion, the spec's verdict), else the last line.
          reason=$(grep -m1 -iE 'ERESOLVE|error|failed|not ok' "$out" || tail -n 1 "$out")
          if [ "$BLOCKING" = true ]; then echo "::error title=$SPEC README install line ($MODE)::${reason:-no output}"; exit 1; fi
          echo "::warning title=$SPEC README install line ($MODE, not blocking yet)::${reason:-no output}"

  receipts-spec:
    # The TLA+ model of the recovery driver's effects (spec/receipts): TLC on both configs, then every guard mutant.
    # It runs when a change reaches the spec, its checkers or its action; receipts-spec-nightly.yml checks main daily.
    runs-on: ubuntu-latest
    # The configs stop at 300 s (they run at once) and each of the 9 mutants at 60 s; with setup, under 20 min.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and its first parent, the base branch's tip: their diff is what a pull request changes.
          fetch-depth: 2
      - name: Does this change reach the receipts spec?
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            merge_group) base="$GROUP_BASE" ;;
            *) base="$PUSH_BASE" ;;
          esac
          # A base this clone cannot reach (a new branch, a force push) checks the spec.
          if [ "$base" != HEAD^1 ] && ! git fetch --no-tags --depth=1 origin "$base" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "base $base unreachable: checked"; exit 0
          fi
          changed=$(git diff --name-only --no-renames "$base" HEAD -- spec/receipts/ scripts/spec/ .github/actions/receipts-spec/)
          echo "${changed:-no receipts spec path changed}"
          if [ -n "$changed" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.paths.outputs.run == 'true'
        uses: ./.github/actions/receipts-spec
      - name: Keep the TLC logs and counterexample traces
        if: always() && steps.paths.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: receipts-tlc
          path: ${{ runner.temp }}/receipts-tlc/**/tlc.log
          if-no-files-found: ignore

  lean:
    # The Lean model of the workflow language (spec/lean): proofs, axiom audit, the model's
    # side of the conformance corpus, and the validator sweep. The TypeScript side of the
    # conformance corpus runs in `npm test` above. The sweep's workflows come from the lean
    # pool's test shards on 24.21.0, so it waits for them; it runs when one failed too, and the sweep fails
    # if a shard's captures are missing. verify does not need it.
    needs: [test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: spec/lean
    steps:
      - uses: actions/checkout@v4
      - name: Restore the Lean toolchain and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            spec/lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('spec/lean/lean-toolchain', 'spec/lean/lakefile.toml', 'spec/lean/lake-manifest.json') }}-${{ hashFiles('spec/lean/**/*.lean') }}
          restore-keys: |
            lean-${{ runner.os }}-${{ hashFiles('spec/lean/lean-toolchain', 'spec/lean/lakefile.toml', 'spec/lean/lake-manifest.json') }}-
      - name: Install elan (the toolchain version comes from lean-toolchain)
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
            # Reviewed installer bytes for elan v4.2.4; a retargeted tag fails here instead of running.
            echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  $RUNNER_TEMP/elan-init.sh" | sha256sum --check --strict
            sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the model and check every proof
        run: lake build
      - name: Run the conformance corpus against the model
        run: lake exe conformance
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm install --global npm@11.21.0 --ignore-scripts
      - name: Build the DSL, whose validator gives TypeScript's verdicts
        working-directory: .
        run: node scripts/npm-ci-retry.mjs --ignore-scripts && npm run build -w @parcha/agentrun-dsl
      - uses: actions/download-artifact@v4
        with:
          pattern: lean-sweep-*
          path: ${{ runner.temp }}/lean-sweep
      - name: Every workflow the test shards validated, with TypeScript's verdicts
        working-directory: .
        env:
          CAPTURES: ${{ runner.temp }}/lean-sweep
        run: >-
          node spec/lean/sweep/collect.mjs --captures "$CAPTURES/lean-sweep-lean-1" --captures "$CAPTURES/lean-sweep-lean-2"
          spec/lean/.lake/validator-corpus.json
      - name: The Lean validator accepts everything the TypeScript validator accepts
        run: lake exe validator-sweep .lake/validator-corpus.json
