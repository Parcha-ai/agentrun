name: Package checks

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25 # p90 is about 12 min; a runner at half speed takes about 23
    strategy:
      fail-fast: false
      matrix:
        # 22.19 = the supported floor, 22.23 = release toolchain, 24.21 = the active LTS line.
        node: ['22.19.0', '22.23.2', '24.21.0']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Changelog fragments
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: node scripts/changes.mjs --check --base "$BASE_SHA"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - name: Demo setup prompts match their specs
        run: node scripts/check-setup-prompts.mjs
      - run: node scripts/generate-schema.mjs --check
      - run: npm run export:source
      - run: node scripts/check-generated.mjs
      - run: npm test
      - run: npm run test:release
      - run: npm run test:examples
      - run: npm run test:viewer
      - run: node scripts/verify-packages.mjs
      - if: matrix.node == '22.23.2'
        run: npm run verify:source
      - if: matrix.node == '22.19.0'
        run: node scripts/check-typescript-floor.mjs
      - name: Retain package verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-verification-${{ matrix.node }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: ignore

  pi-durable-disk-pi-floor:
    # @parcha/pi-durable-disk's peers accept the pi family from 1.0.4, while the workspace develops against 1.1.0. Its
    # build, type-check and whole suite run again with pi-durable, chord and pi-ai at 1.0.4, one copy each: an install
    # into the workspace alone left pi-durable 1.0.4 at the root loading the root's chord and pi-ai 1.1.0.
    # scripts/pi-leg.mjs fails the run if another version was resolved, and sets PI_EXPECT_VERSION for the package's own
    # version guard, which also checks what pi-durable itself loads.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/pi-leg.mjs --pi 1.0.4 --scratch --only @parcha/pi-durable-disk --npm "npx --yes npm@11.21.0" --out .release/pi-leg.json
      - name: Retain the leg's resolved versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-leg-pi-durable-disk-floor
          path: .release/pi-leg.json
          if-no-files-found: ignore

  agentrun-pi-pi-floor:
    # @parcha/agentrun-pi's peers accept the pi family from 1.0.4, while the workspace develops against 1.1.0. Its build,
    # type-check and whole suite run again with all six family packages at 1.0.4, beside pi-durable-disk at 1.0.4 (its
    # crash sweeps load both in one process). scripts/pi-leg.mjs fails the run if another version was resolved.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/pi-leg.mjs --pi 1.0.4 --scratch --only @parcha/agentrun-pi,@parcha/pi-durable-disk --npm "npx --yes npm@11.21.0" --out .release/pi-leg.json
      - name: Retain the leg's resolved versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-leg-agentrun-pi-floor
          path: .release/pi-leg.json
          if-no-files-found: ignore

  pi-1-2:
    # Every package whose pi-family peer ranges accept the leg's pi builds, type-checks and runs its whole suite on it,
    # while the workspace develops on 1.1.0 (verify). scripts/pi-leg.mjs picks the packages from their ranges, so a range
    # that starts to accept a version is tested on it in the same pull request, and fails the run if another version was
    # resolved. From 1.3 pi pins its own packages to exact versions, so each leg installs one whole family.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pi: ['1.2.0', '1.3.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: The clean consumer and the reference example at the leg's pi
        # The packages packed and installed together in an empty directory, with the pi family at this version: one
        # pi-durable and one chord there, and the reference job's record equal to the one fixed for this pi.
        run: node scripts/verify-packages.mjs --pi ${{ matrix.pi }}
      - run: node scripts/pi-leg.mjs --pi ${{ matrix.pi }} --scratch --require-all --npm "npx --yes npm@11.21.0" --out .release/pi-leg.json
      - name: The re-asked fold on this pi
        # A real mid-stream kill and resume, recorded on the pi the leg installed: pi.live must still be version 1 and turn 0 asked twice.
        # It skips until the package has the store export and the disk its beforeResume hook. If pi changes pi.live it fails; it is not adapted.
        run: node --test examples/reference-midstream.test.mjs
      - name: Retain the leg's packages and resolved versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-leg-${{ matrix.pi }}
          path: |
            .release/pi-leg.json
            .release/verification.json
          if-no-files-found: ignore

  pi-cross-version:
    # A run that starts on pi 1.1, is killed, and resumes on pi 1.2 completes. The package's crash tests run with every
    # first process of a run in an install of the packed packages on pi 1.1.0 and every later process in one on 1.2.0;
    # scripts/pi-cross-version.mjs fails unless each install loads one copy of pi-durable, chord and pi-ai at its version.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/pi-cross-version.mjs --from 1.1.0 --to 1.2.0 --npm "npx --yes npm@11.21.0"

  pi-vision-pi-floor:
    # @parcha/pi-vision's peers accept pi-durable and chord from 1.0.4, while the package develops against 1.1.0. Its
    # build, type tests and whole suite run again with pi-durable, chord and pi-ai at 1.0.4 as one copy at the root, which
    # is how a host's install resolves them (a plain `npm install --no-save -w` leaves pi-durable 1.0.4 loading a chord
    # and pi-ai 1.1.0). scripts/pi-leg.mjs fails the run if another version was resolved.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/pi-leg.mjs --pi 1.0.4 --scratch --only @parcha/pi-vision --npm "npx --yes npm@11.21.0" --out .release/pi-leg.json
      - name: Retain the leg's resolved versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-leg-pi-vision-floor
          path: .release/pi-leg.json
          if-no-files-found: ignore

  vision-binaries:
    # @parcha/pi-vision's suites that run programs in the environment (test/binaries: ffmpeg and poppler). They are not
    # part of the verify matrix: they need the programs, not three Node versions. A provider that cannot find its
    # program fails here instead of skipping.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils
          ffmpeg -version | head -1
          pdftoppm -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build -w @parcha/pi-vision
      - run: npm run test:binaries -w @parcha/pi-vision

  pi-transport-pi-floor:
    # @parcha/pi-transport's peers accept the pi family from 1.0.4, while the package develops against 1.1.0. Its build,
    # type-check and whole suite run again with the family at 1.0.4 as one copy at the root, which is how a host's install
    # resolves it (a plain `npm install --no-save -w` leaves pi-durable 1.0.4 loading a chord and pi-ai 1.1.0).
    # scripts/pi-leg.mjs fails the run if another version was resolved.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/pi-leg.mjs --pi 1.0.4 --scratch --only @parcha/pi-transport --npm "npx --yes npm@11.21.0" --out .release/pi-leg.json
      - name: Retain the leg's resolved versions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-leg-pi-transport-floor
          path: .release/pi-leg.json
          if-no-files-found: ignore

  transport-docker:
    # @parcha/pi-transport's formatter and linter, and its box conformance suite on real Docker containers. They are not
    # part of the verify matrix: the suite needs a Docker daemon and an image, not three Node versions. A daemon that
    # cannot start a box fails a test here instead of skipping it.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint -w @parcha/pi-transport
      - run: docker pull debian:bookworm-slim
      - run: npm run test:live:docker -w @parcha/pi-transport

  real-chrome:
    # @parcha/pi-browser's suites that drive a real local Chrome (the coding agent's default provider, the cdp provider, Stagehand's
    # driver and its trace-export seal). They are not part of the verify matrix: they need one pinned browser, not three Node versions.
    # Chrome for Testing is used because the runner's own Chrome answers Extensions.loadUnpacked with "Method not available", so
    # Stagehand's extension cannot load in it. A missing or incapable Chrome fails a test here instead of skipping it.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROME_FOR_TESTING: '155.0.8059.39'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/chrome-for-testing
          key: chrome-for-testing-${{ runner.os }}-${{ env.CHROME_FOR_TESTING }}
      - name: Install the pinned Chrome for Testing
        run: |
          installed=$(npx --yes @puppeteer/browsers@3.2.3 install "chrome@${CHROME_FOR_TESTING}" --path "$HOME/chrome-for-testing")
          chrome="${installed#* }"
          echo "CHROME_PATH=${chrome}" >> "$GITHUB_ENV"
          "${chrome}" --version
      - name: Let an unprivileged Chrome start its sandbox
        # Ubuntu 24.04 runners confine unprivileged user namespaces with AppArmor, so Chrome for Testing (unpackaged, no profile)
        # exits with SIGABRT at startup. This is the runner's documented switch; the sandbox stays on for the tests.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:chrome -w @parcha/pi-browser
      # The assembled reference job on the same Chrome: its record and ledger must be the fixed ones (the receipt name and token counts are not).
      - run: node scripts/check-reference-chrome.mjs

  stranger:
    # A package installed from its packed tarball into an empty directory, with an empty environment and home, runs the one command
    # its README gives with no key (scripts/stranger/<name>.json). Each spec runs on its own runner. A spec that says the package has
    # no such command is reported, not failed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        spec: [agentrun-dsl, agentrun-jev, agentrun-pi, pi-durable-disk, pi-browser, pi-vision, pi-transport, pi-transport-docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Run the stranger test
        # An explicit shell runs with pipefail; the default does not, and tee's status would hide a failing spec.
        shell: bash
        run: |
          node scripts/stranger.mjs "${{ matrix.spec }}" | tee "$RUNNER_TEMP/stranger.out"
          if grep -q 'no-key path missing' "$RUNNER_TEMP/stranger.out"; then echo "::notice title=${{ matrix.spec }}::$(cat "$RUNNER_TEMP/stranger.out")"; fi

  macos-local-run:
    # A run on a local directory on macOS, which has no /proc and no setpriv: the process table comes from ps and
    # sysctl, the run's root is addressed by its path, the file tools are confined by path, and the store syncs with
    # F_FULLFSYNC. No other job runs on a Mac, so every macOS line of the README stands on this one: the stranger's
    # no-key quickstart, and the local run's tests on the Mac's own ps.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: The local run's tests
        working-directory: packages/pi-durable-disk
        run: >-
          node --test --test-timeout=240000
          test/process-table.test.ts test/commands.test.ts test/watchdog.test.ts
          test/local-run.test.ts test/cli-local.test.ts test/quickstart.test.ts test/confine.test.ts
      - name: The stranger's no-key quickstart
        # Not blocking until a release with macOS support is on npm. On a pull request the job runs on the branch merged
        # into main, where the stranger also walks the examples against the registry's beta (#557); the published beta
        # predates macOS support, and its examples fail on a Mac. The Mac's proof is the step above, whose quickstart test
        # runs the same example from this tree.
        continue-on-error: true
        run: node scripts/stranger.mjs pi-durable-disk

  stranger-readme-line:
    # The README's own install line, as a stranger types it, against what the registry serves now (--readme-line):
    # `packed` puts this tree's package in the line, so it says whether the next release installs; `registry` runs the line
    # as written, so it says whether the published package installs today. Unlike `stranger`, the peers are not pinned to
    # the developed versions. A mode that is not `blocking` reports a failure as a warning on the run and passes, so a
    # known failure does not turn every pull request red. Both are blocking: 0.1.0-beta.14, whose peer ranges accept pi
    # below 1.4, installs with the README's own line as written (0.1.0-beta.13, below 1.3, did not once pi 1.3.0 shipped).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: packed
            blocking: true
          - mode: registry
            blocking: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Run the README's install line
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
          BLOCKING: ${{ matrix.blocking }}
        run: |
          flags=(--readme-line)
          if [ "$MODE" = registry ]; then flags+=(--registry); fi
          out="$RUNNER_TEMP/readme-line.out"
          if node scripts/stranger.mjs pi-durable-disk "${flags[@]}" > "$out" 2>&1; then cat "$out"; exit 0; fi
          cat "$out"
          # The first line that says why (npm's ERESOLVE, an assertion, the spec's verdict), else the last line.
          reason=$(grep -m1 -iE 'ERESOLVE|error|failed|not ok' "$out" || tail -n 1 "$out")
          if [ "$BLOCKING" = true ]; then echo "::error title=pi-durable-disk README install line ($MODE)::${reason:-no output}"; exit 1; fi
          echo "::warning title=pi-durable-disk README install line ($MODE, not blocking yet)::${reason:-no output}"

  receipts-spec:
    # The TLA+ model of the recovery driver's effects (spec/receipts): TLC on both configs, then every guard mutant.
    # It runs when a change reaches the spec, its checkers or its action; receipts-spec-nightly.yml checks main daily.
    runs-on: ubuntu-latest
    # The configs stop at 300 s (they run at once) and each of the 9 mutants at 60 s; with setup, under 20 min.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit and its first parent, the base branch's tip: their diff is what a pull request changes.
          fetch-depth: 2
      - name: Does this change reach the receipts spec?
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            merge_group) base="$GROUP_BASE" ;;
            *) base="$PUSH_BASE" ;;
          esac
          # A base this clone cannot reach (a new branch, a force push) checks the spec.
          if [ "$base" != HEAD^1 ] && ! git fetch --no-tags --depth=1 origin "$base" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "base $base unreachable: checked"; exit 0
          fi
          changed=$(git diff --name-only --no-renames "$base" HEAD -- spec/receipts/ scripts/spec/ .github/actions/receipts-spec/)
          echo "${changed:-no receipts spec path changed}"
          if [ -n "$changed" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.paths.outputs.run == 'true'
        uses: ./.github/actions/receipts-spec
      - name: Keep the TLC logs and counterexample traces
        if: always() && steps.paths.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: receipts-tlc
          path: ${{ runner.temp }}/receipts-tlc/**/tlc.log
          if-no-files-found: ignore

  lean:
    # The Lean model of the workflow language (spec/lean): proofs, axiom audit, the model's
    # side of the conformance corpus, and the validator sweep. The TypeScript side of the
    # conformance corpus runs in `npm test` above.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: spec/lean
    steps:
      - uses: actions/checkout@v4
      - name: Restore the Lean toolchain and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            spec/lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('spec/lean/lean-toolchain', 'spec/lean/lakefile.toml', 'spec/lean/lake-manifest.json') }}-${{ hashFiles('spec/lean/**/*.lean') }}
          restore-keys: |
            lean-${{ runner.os }}-${{ hashFiles('spec/lean/lean-toolchain', 'spec/lean/lakefile.toml', 'spec/lean/lake-manifest.json') }}-
      - name: Install elan (the toolchain version comes from lean-toolchain)
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
            # Reviewed installer bytes for elan v4.2.4; a retargeted tag fails here instead of running.
            echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  $RUNNER_TEMP/elan-init.sh" | sha256sum --check --strict
            sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the model and check every proof
        run: lake build
      - name: Run the conformance corpus against the model
        run: lake exe conformance
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Build the TypeScript packages
        working-directory: .
        run: npm ci --ignore-scripts && npm run build
      - name: Collect every workflow the test suites validate, with TypeScript's verdicts
        working-directory: .
        run: node spec/lean/sweep/collect.mjs spec/lean/.lake/validator-corpus.json
      - name: The Lean validator accepts everything the TypeScript validator accepts
        run: lake exe validator-sweep .lake/validator-corpus.json
