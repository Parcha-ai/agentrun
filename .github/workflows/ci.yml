name: Package checks

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22.19 = the supported floor, 22.23 = release toolchain, 24.21 = the active LTS line.
        node: ['22.19.0', '22.23.2', '24.21.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: node scripts/generate-schema.mjs --check
      - run: npm run export:source
      - run: node scripts/check-generated.mjs
      - name: npm test
        run: npm test
        # Under the job's 15 minutes, so a hang ends this step rather than the job: the step's log is kept and the upload below
        # still runs. scripts/ci-test-reporter.mjs writes each package's tests as they start and end (a hung test is a "start"
        # with no end) and its junit results into TEST_RESULTS_DIR.
        timeout-minutes: 9
        env:
          TEST_RESULTS_DIR: ${{ runner.temp }}/test-results
          NODE_OPTIONS: --test-reporter=spec --test-reporter-destination=stdout --test-reporter=${{ github.workspace }}/scripts/ci-test-reporter.mjs --test-reporter-destination=stdout
      - run: npm run test:release
      - run: npm run test:examples
      - run: node scripts/verify-packages.mjs
      - if: matrix.node == '22.23.2'
        run: npm run verify:source
      - if: matrix.node == '22.19.0'
        run: node scripts/check-typescript-floor.mjs
      - name: Retain the test results (each test's start and end, junit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.node }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: ignore
      - name: Retain package verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-verification-${{ matrix.node }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: ignore

  real-chrome:
    # @parcha/pi-browser's suites that drive a real local Chrome (the coding agent's default provider, the cdp provider, Stagehand's
    # driver and its trace-export seal). They are not part of the verify matrix: they need one pinned browser, not three Node versions.
    # Chrome for Testing is used because the runner's own Chrome answers Extensions.loadUnpacked with "Method not available", so
    # Stagehand's extension cannot load in it. A missing or incapable Chrome fails a test here instead of skipping it.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROME_FOR_TESTING: '155.0.8059.39'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/chrome-for-testing
          key: chrome-for-testing-${{ runner.os }}-${{ env.CHROME_FOR_TESTING }}
      - name: Install the pinned Chrome for Testing
        run: |
          installed=$(npx --yes @puppeteer/browsers@3.2.3 install "chrome@${CHROME_FOR_TESTING}" --path "$HOME/chrome-for-testing")
          chrome="${installed#* }"
          echo "CHROME_PATH=${chrome}" >> "$GITHUB_ENV"
          "${chrome}" --version
      - name: Let an unprivileged Chrome start its sandbox
        # Ubuntu 24.04 runners confine unprivileged user namespaces with AppArmor, so Chrome for Testing (unpackaged, no profile)
        # exits with SIGABRT at startup. This is the runner's documented switch; the sandbox stays on for the tests.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run test:chrome -w @parcha/pi-browser

  lean:
    # The Lean model of the workflow language (spec/lean): proofs, axiom audit, the model's
    # side of the conformance corpus, and the validator sweep. The TypeScript side of the
    # conformance corpus runs in `npm test` above.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: spec/lean
    steps:
      - uses: actions/checkout@v4
      - name: Restore the Lean toolchain and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            spec/lean/.lake
          key: lean-${{ runner.os }}-${{ hashFiles('spec/lean/lean-toolchain', 'spec/lean/lakefile.toml', 'spec/lean/lake-manifest.json') }}-${{ hashFiles('spec/lean/**/*.lean') }}
          restore-keys: |
            lean-${{ runner.os }}-${{ hashFiles('spec/lean/lean-toolchain', 'spec/lean/lakefile.toml', 'spec/lean/lake-manifest.json') }}-
      - name: Install elan (the toolchain version comes from lean-toolchain)
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.2.4/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
            # Reviewed installer bytes for elan v4.2.4; a retargeted tag fails here instead of running.
            echo "a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  $RUNNER_TEMP/elan-init.sh" | sha256sum --check --strict
            sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the model and check every proof
        run: lake build
      - name: Run the conformance corpus against the model
        run: lake exe conformance
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Build the TypeScript packages
        working-directory: .
        run: npm ci --ignore-scripts && npm run build
      - name: Collect every workflow the test suites validate, with TypeScript's verdicts
        working-directory: .
        run: node spec/lean/sweep/collect.mjs spec/lean/.lake/validator-corpus.json
      - name: The Lean validator accepts everything the TypeScript validator accepts
        run: lake exe validator-sweep .lake/validator-corpus.json

  examples:
    # The examples' own suites under packages/pi-durable-disk/examples, which no other job runs: 03-tab-to-cloud and 04-walks-home's
    # tab, vm, show, universes, gg-onemore, cluster, policy and self-tools. Each step installs its suite as its README says (its
    # own lockfile; npm install for 03 and cluster, which have none), so a failed install fails only that suite, then runs it with
    # npm test's per-test deadline and force-exit (show's runner passes the same to node:test's run()). scripts/examples-job.test.mjs keeps every suite here and every command on those flags.
    # Reporting only for now: continue-on-error keeps a red run from blocking merges; it becomes required once it is green for a day.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    defaults:
      run:
        working-directory: packages/pi-durable-disk/examples
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Build the packages the examples import
        working-directory: .
        run: npm ci --ignore-scripts && npm run build
      - name: Install the 04 tab (03's tests and build use its wllama)
        working-directory: packages/pi-durable-disk/examples/04-walks-home/tab
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 03-tab-to-cloud
        if: success() || failure()
        timeout-minutes: 8
        working-directory: packages/pi-durable-disk/examples/03-tab-to-cloud
        run: npm install --no-workspaces --ignore-scripts --no-audit --no-fund && node --test --test-timeout=240000 --test-force-exit 'test/*.test.ts'
      - name: 04 tab
        if: success() || failure()
        timeout-minutes: 6
        working-directory: packages/pi-durable-disk/examples/04-walks-home/tab
        run: node --test --test-timeout=240000 --test-force-exit test/*.test.ts
      - name: 04 vm
        if: success() || failure()
        timeout-minutes: 6
        working-directory: packages/pi-durable-disk/examples/04-walks-home/vm
        run: npm ci --ignore-scripts --no-audit --no-fund && node --test --test-timeout=240000 --test-force-exit 'test/*.test.ts'
      - name: 04 show
        if: success() || failure()
        timeout-minutes: 8
        working-directory: packages/pi-durable-disk/examples/04-walks-home/show
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run build && node scripts/run-tests.mjs
      - name: 04 universes
        if: success() || failure()
        timeout-minutes: 6
        working-directory: packages/pi-durable-disk/examples/04-walks-home/universes
        run: npm ci --ignore-scripts --no-audit --no-fund && node --test --test-timeout=240000 --test-force-exit 'test/*.test.ts'
      - name: 04 gg-onemore
        if: success() || failure()
        timeout-minutes: 6
        working-directory: packages/pi-durable-disk/examples/04-walks-home/gg-onemore
        run: npm ci --ignore-scripts --no-audit --no-fund && node --test --test-timeout=240000 --test-force-exit 'pi/test/*.test.ts' 'e2e/test/*.test.ts' 'chat/test/*.test.ts'
      - name: 04 cluster
        if: success() || failure()
        timeout-minutes: 6
        working-directory: packages/pi-durable-disk/examples/04-walks-home/cluster
        run: npm install --no-workspaces --ignore-scripts --no-audit --no-fund && node --test --test-timeout=240000 --test-force-exit 'test/*.test.ts'
      - name: 04 policy
        if: success() || failure()
        timeout-minutes: 6
        working-directory: packages/pi-durable-disk/examples/04-walks-home/policy
        run: npm ci --ignore-scripts --no-audit --no-fund && node --test --test-timeout=240000 --test-force-exit test/*.test.ts
      - name: 04 self-tools
        if: success() || failure()
        timeout-minutes: 6
        working-directory: packages/pi-durable-disk/examples/04-walks-home/self-tools
        run: npm ci --ignore-scripts --no-audit --no-fund && node --test --test-timeout=240000 --test-force-exit 'test/*.test.ts' ../../03-tab-to-cloud/test/tool-format.test.ts ../../03-tab-to-cloud/test/decode-lazy.test.ts ../../03-tab-to-cloud/test/limits.test.ts
