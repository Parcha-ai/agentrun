name: Install walk

# The installer (packages/agentrun/install.sh) and `agentrun service` on fresh machines with no Node.js on PATH
# (packages/agentrun/test/install-walk.sh): an Ubuntu container with no service manager, x64 and arm64; an Ubuntu VM with a
# systemd user session; a macOS runner with launchd in its Aqua session. On a pull request or push it installs this
# checkout's launcher, packed; after a release, the published one. The container also walks --tailscale with a fake
# tailscale (packages/agentrun/test/fake-tailscale.sh): no tailnet, no secret. No model is called. Not a required check.
# The vps job walks --vps as root on a runner whose Docker it purges first (packages/agentrun/test/vps-walk.sh): the
# release's published image, then, on a pull request or push, this checkout's, with a faux model (no key).

on:
  pull_request:
    paths:
      - 'packages/agentrun/install.sh'
      - 'packages/agentrun/lib/service.mjs'
      - 'packages/agentrun/lib/tailscale.mjs'
      - 'packages/agentrun/bin/agentrun.mjs'
      - 'packages/agentrun/test/install-walk.sh'
      - 'packages/agentrun/test/fake-tailscale.sh'
      - 'packages/agentrun/test/vps-walk.sh'
      - 'packages/agentrun/test/vps-faux-shell.mjs'
      - '.github/workflows/install-walk.yml'
  push:
    branches: [main]
    paths:
      - 'packages/agentrun/install.sh'
      - 'packages/agentrun/lib/service.mjs'
      - 'packages/agentrun/lib/tailscale.mjs'
      - 'packages/agentrun/bin/agentrun.mjs'
      - 'packages/agentrun/test/install-walk.sh'
      - 'packages/agentrun/test/fake-tailscale.sh'
      - 'packages/agentrun/test/vps-walk.sh'
      - 'packages/agentrun/test/vps-faux-shell.mjs'
      - '.github/workflows/install-walk.yml'
  workflow_run:
    workflows: ['Publish verified beta']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-walk-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pack:
    name: lint and pack the launcher
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package: ${{ steps.pack.outputs.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: shellcheck
        run: shellcheck --severity=warning -s sh packages/agentrun/install.sh packages/agentrun/test/fake-tailscale.sh && shellcheck --severity=warning packages/agentrun/test/install-walk.sh packages/agentrun/test/vps-walk.sh
      # After a release the walk installs what npm serves; otherwise this checkout's launcher.
      - name: Pack
        id: pack
        run: |
          mkdir -p launcher
          if [ "${{ github.event_name }}" = workflow_run ]; then
            echo "package=" >> "$GITHUB_OUTPUT"
          else
            npm pack ./packages/agentrun --pack-destination launcher
            echo "package=$(ls launcher)" >> "$GITHUB_OUTPUT"
          fi
          ls -la launcher
      - uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: launcher
          if-no-files-found: ignore

  container:
    name: container, no service manager (${{ matrix.runner }})
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    container: ubuntu:24.04
    steps:
      - name: curl, and nothing else
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates > /dev/null
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: ${{ needs.pack.outputs.package != '' }}
        with:
          name: launcher
          path: /tmp/launcher
      - name: Walk
        shell: bash
        env:
          PACKAGE: ${{ needs.pack.outputs.package }}
          # x64 pins Node to the launcher's floor (--node-version), so a failure there is never a new Node release; arm64
          # takes the installer's choice, the newest on the floor's major line.
          NODE_PIN: ${{ runner.arch == 'X64' && '1' || '' }}
        run: packages/agentrun/test/install-walk.sh container ${PACKAGE:+--package /tmp/launcher/$PACKAGE}

  vps:
    name: VPS, Docker Compose as root (--vps)
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Walk
        env:
          BUILD: ${{ github.event_name != 'workflow_run' && '--build' || '' }}
        run: sudo packages/agentrun/test/vps-walk.sh $BUILD

  linux:
    name: Linux, systemd user service
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: ${{ needs.pack.outputs.package != '' }}
        with:
          name: launcher
          path: /tmp/launcher
      # The runner's user has no session of its own: lingering starts its systemd user manager, as a login would.
      - name: A systemd user session
        run: |
          sudo loginctl enable-linger "$USER"
          for i in $(seq 1 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Walk
        shell: bash
        env:
          PACKAGE: ${{ needs.pack.outputs.package }}
        run: PATH=/usr/sbin:/usr/bin:/sbin:/bin packages/agentrun/test/install-walk.sh service ${PACKAGE:+--package /tmp/launcher/$PACKAGE}
      - name: The service's log
        if: ${{ always() }}
        run: cat ~/.agentrun/logs/agentrun.log || true

  macos:
    name: macOS, launchd LaunchAgent
    needs: pack
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: ${{ needs.pack.outputs.package != '' }}
        with:
          name: launcher
          path: /tmp/launcher
      - name: Walk
        shell: bash
        env:
          PACKAGE: ${{ needs.pack.outputs.package }}
        run: PATH=/usr/bin:/bin:/usr/sbin:/sbin packages/agentrun/test/install-walk.sh service ${PACKAGE:+--package /tmp/launcher/$PACKAGE}
      - name: The service's log
        if: ${{ always() }}
        run: cat ~/.agentrun/logs/agentrun.log || true
