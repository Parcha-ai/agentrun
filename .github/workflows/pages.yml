name: Gallery

# The hosted gallery: apps/viewer built with its bundled recordings and published to GitHub Pages. It is a replay
# viewer: static files that play recorded runs, with no agent, no model and no key. The only credential is the job's
# own GITHUB_TOKEN, scoped to Pages.

on:
  push:
    branches: [main]
    paths:
      - 'apps/viewer/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Parcha-ai/agentrun'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # The gate reads a recording's report page with an HTML parser (htmlparser2, a dependency of the reference package): installed from the lockfile, without running any package's scripts.
      - name: Install the gate's dependencies
        run: npm ci --ignore-scripts
      # The recordings are not in git: they are one tar on the release tagged gallery, which the lock names with its
      # SHA-256 and the gallery's ids. Nothing is unpacked unless the tar hashes to the lock, holds only those ids'
      # manifests, lines and blobs, no recording is over 40 MB and the gallery not over 150 MB, and each poster is an
      # image its recording holds. The download uses the job's own token, which reads the repository.
      - name: Fetch the gallery's recordings
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/recording/gallery.mjs fetch apps/viewer/recordings.lock.json apps/viewer/recordings
      # The recordings ship as files with recordings/index.json, so the page stays small however many runs it holds.
      - name: Build the viewer and its gallery
        run: node apps/viewer/build.mjs --files
      # Nothing is published unless what was built passes: every recording in it valid (agentrun.recording/1), holding
      # only its manifest, its lines and its blobs; every text file free of credential shapes and machine paths; the
      # gallery embedding exactly the recordings beside it. An empty gallery fails too.
      - name: Gate on what would be published
        run: node scripts/recording/gate.mjs apps/viewer/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/viewer/dist
      - id: deployment
        uses: actions/deploy-pages@v4
