\* CI: two call steps, two crashes, failing commits.
SPECIFICATION Spec
\* A run that ended (refused, faulted, done, stopped) with no crash left has nothing more to do: that is its end, not a deadlock.
CHECK_DEADLOCK FALSE
CONSTANTS
  N = 2
  MaxCrashes = 2
  CommitsMayFail = TRUE
INVARIANT TypeOK
INVARIANT I1_AdmitBeforeDispatch
INVARIANT I3_OneDispatchPerKey
INVARIANT I3_CallRefused
INVARIANT I6_NoAdmissionAfterFault
INVARIANT I7_CompletedDispatchedOnce
INVARIANT I7_DoneSettledEveryCall
INVARIANT I8_StopOnJournalOrHeard
INVARIANT I9_NoAdmissionAfterStop
INVARIANT I10_CancelledNeverResumes
PROPERTY I7_ReceiptsNeverErased
