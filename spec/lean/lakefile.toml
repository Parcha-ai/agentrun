name = "AgentRunSemantics"
version = "0.1.0"
defaultTargets = ["AgentRunSemantics", "AgentRunEnvelope", "Check", "conformance", "validator-sweep"]

[[lean_lib]]
name = "AgentRunSemantics"

[[lean_lib]]
name = "AgentRunEnvelope"

[[lean_exe]]
name = "conformance"
root = "Conformance"

[[lean_lib]]
name = "Check"
roots = ["AgentRunSemantics.Check", "AgentRunEnvelope.Check"]

[[lean_exe]]
name = "validator-sweep"
root = "ValidatorSweep"
