name = "AgentRunSemantics"
version = "0.1.0"
defaultTargets = ["AgentRunSemantics", "AgentRunEnvelope", "Check", "conformance", "validator-sweep", "AgentRunRecovery", "RecoveryCheck"]

[[lean_lib]]
name = "AgentRunSemantics"

[[lean_lib]]
name = "AgentRunEnvelope"

[[lean_exe]]
name = "conformance"
root = "Conformance"

[[lean_lib]]
name = "Check"
roots = ["AgentRunSemantics.Check", "AgentRunEnvelope.Check"]

[[lean_exe]]
name = "validator-sweep"
root = "ValidatorSweep"

# The recovery driver's effects (Frozen.lean), beside spec/receipts/Receipts.tla. Independent of the semantics model.
[[lean_lib]]
name = "AgentRunRecovery"

[[lean_lib]]
name = "RecoveryCheck"
roots = ["AgentRunRecovery.Check"]
