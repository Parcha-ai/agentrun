{{- if not .Values.existingSecret }}
{{- /*
The token and the seal key, made at install and kept on every upgrade: lookup reads the ones the cluster already holds,
a Secret an earlier uninstall kept (keepOnUninstall) included.
Losing the seal key loses the model keys, MCP credentials and trigger secrets sealed under it. An upgrade that can't read
the Secret stops here rather than make new keys. Under `helm template` (Argo CD, Flux) lookup reads nothing and every
render would make new ones: set existingSecret there.
*/}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace .Release.Name).data | default dict }}
{{- if and .Release.IsUpgrade (not $old) }}
{{- fail (printf "can't read Secret %s/%s, which holds this release's token and seal key: an upgrade needs get on Secrets in its namespace, or existingSecret" .Release.Namespace .Release.Name) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "agentrun.labels" . | nindent 4 }}
  {{- if .Values.keepOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: Opaque
data:
  AGENTRUN_TOKEN: {{ $old.AGENTRUN_TOKEN | default (randAlphaNum 64 | b64enc) | quote }}
  AGENTRUN_SEAL_KEY: {{ $old.AGENTRUN_SEAL_KEY | default (randBytes 32 | b64enc) | quote }}
{{- end }}
