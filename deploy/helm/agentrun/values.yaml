# AgentRun Server's chart (README.md). The token and the seal key are never values here: the chart makes them as a Secret
# at install and keeps them on every upgrade, or reads them from existingSecret.

image:
  repository: ghcr.io/parcha-ai/agentrun-server
  # Empty: v<appVersion>, the release this chart came with.
  tag: ""
  pullPolicy: IfNotPresent

# A Secret of your own with AGENTRUN_TOKEN (32 characters or more) and AGENTRUN_SEAL_KEY (openssl rand -base64 32); each
# of its keys becomes a variable. Set it under Argo CD, Flux or `helm template`, which can't read the cluster and would
# make new keys at every render. The chart then makes no Secret, and helm uninstall leaves yours.
existingSecret: ""

persistence:
  size: 10Gi
  # Empty: the cluster's default StorageClass.
  storageClass: ""
  # A PersistentVolumeClaim of your own for /data. The chart then makes none, and helm uninstall leaves it.
  existingClaim: ""

# 2Gi, as on Render: the runner budgets runs by this limit (deploy/README.md, runner memory).
resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    memory: 2Gi

# How long a stopping pod has before it is killed. The server's runner lets busy runs finish their turn for the drain
# (--drain-timeout, 6s in the image's command), then gives a loop that does not stop 25 s more: 35 s covers both, as in
# deploy/compose.yaml. Raise it with a longer drain, or runs wait for their claims to expire before they resume.
terminationGracePeriodSeconds: 35

# Plain variables, by name.
# AGENTRUN_PUBLIC_URL: the console's address, for the server's links. Unset: the ingress's (http(s)://<host>/).
# Set it when TLS ends before the ingress.
# AGENTRUN_TELEMETRY: "0" turns the usage counts off (docs/telemetry.md). Model keys go in the console (Settings, Model
# keys), never here.
env: {}

# The container's arguments. Empty: the image's own, the server and a runner on /data, port 7340.
args: []

extraVolumes: []
extraVolumeMounts: []

service:
  type: ClusterIP
  port: 7340

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  # The TLS Secret for host. Empty: no TLS on the ingress.
  tlsSecret: ""
