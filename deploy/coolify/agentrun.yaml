# documentation: https://github.com/Parcha-ai/agentrun/blob/main/deploy/README.md#coolify
# slogan: AgentRun Server: run AI agents on your own server, from a console or its API.
# category: ai
# tags: ai,agents,automation,api,llm
# logo: svgs/agentrun.svg
# port: 7340

# AgentRun Server on Coolify, in the shape of Coolify's own templates (templates/compose/*.yaml): the release's image as
# one service, the server with one runner beside it, its data on a volume at /data. Coolify generates the token and the
# seal key once (its magic variables) and gives the service its domain. No Docker socket: agents get file tools and
# web_fetch but no shell. Needs no model key: once it's live, set your password with the token (the service's
# Environment Variables), then Continue with ChatGPT or add a key in the console.
services:
  agentrun:
    image: ghcr.io/parcha-ai/agentrun-server:v0.1.0-beta.46
    environment:
      - SERVICE_URL_AGENTRUN_7340
      - AGENTRUN_PUBLIC_URL=${SERVICE_URL_AGENTRUN}
      # 64 hex characters (32 random bytes): the setup code at the first visit, and the API's token.
      - AGENTRUN_TOKEN=${SERVICE_HEX_64_AGENTRUN}
      # base64 of 32 random bytes: saved model and tool keys, MCP credentials and trigger secrets are sealed under it.
      # Keep it: without it they can't be opened.
      - AGENTRUN_SEAL_KEY=${SERVICE_REALBASE64_32_SEALKEY}
    volumes:
      - agentrun-data:/data
    # The runner's close bound is 31 s (a 6 s drain, then 25 s): Docker's default 10 s would cut a busy run's turn.
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "env", "-i", "/usr/local/bin/node", "-e", "fetch('http://127.0.0.1:7340/v2/health').then(({ ok, status }) => { if (!ok) throw new Error(String(status)) })"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  agentrun-data:
