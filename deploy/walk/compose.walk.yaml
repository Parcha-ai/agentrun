# The walks' overlay on deploy/compose.yaml (smoke.sh, reclaim.sh): the same server and runners on the faux model of
# faux-steps.mjs, no key and no network. The server takes --faux and publishes no port: the walks reach it from inside
# its container (`docker compose exec`). Each runner takes the same module with its own --faux: a runner loads a faux
# module only when its start says so, never from its environment. This directory is mounted read-only at /walk (as
# ./walk: a path here is read from deploy/, the first file's directory). Each health check is tried every second while
# its service starts, not every 5 s (Docker's default): the runners wait on the server's, so the walk waited two of
# those 5 s ticks. Its interval, timeout and retries are compose.yaml's.
services:
  server:
    command: ["--data", "/data", "--listen", "server", "--port", "7340", "--drain-timeout", "6s", "--no-runner", "--faux", "/walk/faux-steps.mjs"]
    ports: !reset []
    volumes:
      - ./walk:/walk:ro
    healthcheck:
      start_interval: 1s
  runner-1:
    command: ["runner", "--data", "/data", "--name", "runner-1", "--faux", "/walk/faux-steps.mjs"]
    volumes:
      - ./walk:/walk:ro
    healthcheck:
      start_interval: 1s
  runner-2:
    command: ["runner", "--data", "/data", "--name", "runner-2", "--faux", "/walk/faux-steps.mjs"]
    volumes:
      - ./walk:/walk:ro
    healthcheck:
      start_interval: 1s
