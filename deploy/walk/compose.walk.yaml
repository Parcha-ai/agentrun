# The walks' overlay on deploy/compose.yaml (smoke.sh, reclaim.sh): the same server and runners on the faux model of
# faux-steps.mjs, no key and no network. The server takes --faux and publishes no port: the walks reach it from inside
# its container (`docker compose exec`). Each runner takes the same module from AGENTRUN_SERVE_FAUX. This directory is
# mounted read-only at /walk (as ./walk: a path here is read from deploy/, the first file's directory).
services:
  server:
    command: ["--data", "/data", "--listen", "server", "--port", "7340", "--drain-timeout", "6s", "--no-runner", "--faux", "/walk/faux-steps.mjs"]
    ports: !reset []
    volumes:
      - ./walk:/walk:ro
  runner-1:
    environment:
      AGENTRUN_SERVE_FAUX: /walk/faux-steps.mjs
    volumes:
      - ./walk:/walk:ro
  runner-2:
    environment:
      AGENTRUN_SERVE_FAUX: /walk/faux-steps.mjs
    volumes:
      - ./walk:/walk:ro
