# The walks' overlay on deploy/compose.yaml (smoke.sh, reclaim.sh): the same server and runners on the faux model of
# faux-steps.mjs, no key and no network. The server takes --faux and publishes no port: the walks reach it from inside
# its container (`docker compose exec`). Each runner takes the same module by its own --faux (a faux name in a runner's
# environment enables nothing). This directory is mounted read-only at /walk (as ./walk: a path here is read from
# deploy/, the first file's directory).
services:
  server:
    command: ["--data", "/data", "--listen", "server", "--port", "7340", "--drain-timeout", "6s", "--no-runner", "--faux", "/walk/faux-steps.mjs"]
    ports: !reset []
    volumes:
      - ./walk:/walk:ro
  runner-1:
    command: ["runner", "--data", "/data", "--name", "runner-1", "--faux", "/walk/faux-steps.mjs"]
    volumes:
      - ./walk:/walk:ro
  runner-2:
    command: ["runner", "--data", "/data", "--name", "runner-2", "--faux", "/walk/faux-steps.mjs"]
    volumes:
      - ./walk:/walk:ro
