# AgentRun Server on Dokploy, in the shape of Dokploy's own templates (Dokploy/templates, blueprints/<name>): this file and
# template.toml. The release's image as one service, the server with one runner beside it, its data on a volume at
# /data. template.toml has Dokploy generate the token and the seal key once and gives the service its domain. No Docker
# socket: agents get file tools and web_fetch but no shell. Needs no model key.
services:
  agentrun:
    image: ghcr.io/parcha-ai/agentrun-server:v0.1.0-beta.46
    restart: unless-stopped
    expose:
      - 7340
    environment:
      AGENTRUN_PUBLIC_URL: ${AGENTRUN_PUBLIC_URL}
      AGENTRUN_TOKEN: ${AGENTRUN_TOKEN}
      AGENTRUN_SEAL_KEY: ${AGENTRUN_SEAL_KEY}
    volumes:
      - agentrun-data:/data
    # The runner's close bound is 31 s (a 6 s drain, then 25 s): Docker's default 10 s would cut a busy run's turn.
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "env", "-i", "/usr/local/bin/node", "-e", "fetch('http://127.0.0.1:7340/v2/health').then(({ ok, status }) => { if (!ok) throw new Error(String(status)) })"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  agentrun-data:
