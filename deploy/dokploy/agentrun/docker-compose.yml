# AgentRun Server on Dokploy. Steps and variables: deploy/README.md#dokploy.
services:
  agentrun:
    image: ghcr.io/parcha-ai/agentrun-server:v0.1.0-beta.55
    restart: unless-stopped
    expose:
      - 7340
    environment:
      AGENTRUN_PUBLIC_URL: ${AGENTRUN_PUBLIC_URL}
      AGENTRUN_TOKEN: ${AGENTRUN_TOKEN}
      AGENTRUN_SEAL_KEY: ${AGENTRUN_SEAL_KEY}
    volumes:
      - agentrun-data:/data
    # The runner budgets runs by this limit, less 128 MiB (deploy/README.md, runner memory): 2 GB, as on Render. Without one
    # it would budget the whole server's memory, the platform's and other apps' included. Set AGENTRUN_MEMORY (1g, 4g, ...)
    # to change it.
    mem_limit: ${AGENTRUN_MEMORY:-2g}
    # The runner's close bound is 31 s (a 6 s drain, then 25 s): Docker's default 10 s would cut a busy run's turn.
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "env", "-i", "/usr/local/bin/node", "-e", "fetch('http://127.0.0.1:7340/v2/health').then(({ ok, status }) => { if (!ok) throw new Error(String(status)) })"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  agentrun-data:
