<svg xmlns="http://www.w3.org/2000/svg" width="880" height="444" viewBox="0 0 880 444" role="img" aria-labelledby="title desc">
<title id="title">Where your agent lives</title>
<desc id="desc">The control plane reads one disk you own. On it: store.sqlite with the agents and runs, a runs folder per run with run.sqlite and work, and a home per agent with its learning repo and sign-ins. A run mounts its own folder.</desc>
<g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">

<rect x="20" y="16" width="840" height="52" fill="#6d28d9" stroke="#6d28d9" stroke-width="2"/>
<text x="440" y="48" font-size="17" font-weight="700" fill="#ffffff">Control plane</text>

<rect x="20" y="104" width="840" height="236" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
<text x="40" y="132" font-size="15" font-weight="700" fill="#4c1d95" text-anchor="start">Your disk</text>

<g fill="#ffffff" stroke="#6d28d9" stroke-width="1.5">
<rect x="44" y="152" width="256" height="168"/>
<rect x="312" y="152" width="256" height="168"/>
<rect x="580" y="152" width="256" height="168"/>
</g>
<g fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.25">
<rect x="64" y="204" width="216" height="44"/>
<rect x="64" y="260" width="216" height="44"/>
<rect x="332" y="204" width="216" height="44"/>
<rect x="332" y="260" width="216" height="44"/>
<rect x="600" y="204" width="216" height="44"/>
<rect x="600" y="260" width="216" height="44"/>
</g>

<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#111827">
<text x="172" y="186">store.sqlite</text>
<text x="440" y="186">runs/&lt;id&gt;/</text>
<text x="708" y="186">homes/&lt;agent&gt;/</text>
</g>
<g font-size="15" fill="#111827">
<text x="172" y="231">agents</text>
<text x="172" y="287">runs</text>
</g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#111827">
<text x="440" y="231">run.sqlite</text>
<text x="440" y="287">work/</text>
<text x="708" y="231">learning/</text>
<text x="708" y="287">sign-ins/</text>
</g>

<g stroke="#6d28d9" stroke-width="2.5">
<line x1="172" y1="68" x2="172" y2="142"/>
<line x1="440" y1="68" x2="440" y2="142"/>
<line x1="708" y1="68" x2="708" y2="142"/>
<line x1="440" y1="330" x2="440" y2="380"/>
</g>
<g fill="#6d28d9">
<polygon points="165,140 179,140 172,150"/>
<polygon points="433,140 447,140 440,150"/>
<polygon points="701,140 715,140 708,150"/>
<polygon points="433,332 447,332 440,322"/>
</g>

<rect x="312" y="380" width="256" height="48" fill="#6d28d9" stroke="#6d28d9" stroke-width="2"/>
<text x="440" y="410" font-size="17" font-weight="700" fill="#ffffff">Run</text>

</g>
</svg>
