<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
<title id="title">From an agent to a workflow</title>
<desc id="desc">Repeated runs of an agent propose a workflow draft, the grader checks it, and it becomes a typed workflow with fixed steps and Jev decisions that runs with no agent turn where none is needed.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0 L8 4 L0 8 z" fill="#374151"/>
</marker>
</defs>
<rect x="0.75" y="0.75" width="718.5" height="298.5" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#111827">
<text x="24" y="38" font-size="20" font-weight="700">Not everything is an agent</text>

<rect x="24" y="62" width="208" height="160" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
<text x="40" y="88" font-size="14" font-weight="700">Runs 1 to n</text>
<text x="40" y="110" font-size="12" fill="#4b5563">The agent does the job.</text>
<text x="40" y="128" font-size="12" fill="#4b5563">Each run ends with one more</text>
<text x="40" y="146" font-size="12" fill="#4b5563">turn that proposes notes,</text>
<text x="40" y="164" font-size="12" fill="#4b5563">skills and a workflow draft</text>
<text x="40" y="182" font-size="12" fill="#4b5563">for the steps it repeats.</text>
<line x1="232" y1="142" x2="254" y2="142" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="256" y="62" width="208" height="160" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
<text x="272" y="88" font-size="14" font-weight="700">The grader</text>
<text x="272" y="110" font-size="12" fill="#4b5563">One rubric, stated once.</text>
<text x="272" y="128" font-size="12" fill="#4b5563">Keeps what holds up, drops</text>
<text x="272" y="146" font-size="12" fill="#4b5563">the rest, holds a risky rule</text>
<text x="272" y="164" font-size="12" fill="#4b5563">for your OK. You can retire</text>
<text x="272" y="182" font-size="12" fill="#4b5563">anything it kept.</text>
<line x1="464" y1="142" x2="486" y2="142" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="488" y="62" width="208" height="160" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
<text x="504" y="88" font-size="14" font-weight="700">A typed workflow</text>
<text x="504" y="110" font-size="12" fill="#4b5563">Fixed steps. Jev decides</text>
<text x="504" y="128" font-size="12" fill="#4b5563">where a decision is needed.</text>
<text x="504" y="146" font-size="12" fill="#4b5563">No agent turn where none</text>
<text x="504" y="164" font-size="12" fill="#4b5563">is needed. Cheaper, faster,</text>
<text x="504" y="182" font-size="12" fill="#4b5563">and the same every time.</text>

<text x="24" y="252" font-size="12" font-weight="700">Today</text>
<text x="70" y="252" font-size="12" fill="#4b5563">a learned workflow runs as one tool inside the agent's next runs, on every harness.</text>
<text x="24" y="274" font-size="12" font-weight="700">Planned</text>
<text x="82" y="274" font-size="12" fill="#4b5563">promote one to run on its own, as a workflow agent, with no agent loop at all.</text>
</g>
</svg>
