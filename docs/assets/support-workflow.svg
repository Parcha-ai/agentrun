<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc"><title id="title">AgentRun support workflow</title><desc id="desc">Search for an answer, check it with Jev, and return it if it fits. Otherwise, call an agent once, check again, and escalate unresolved requests.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#72727d" stroke-width="1"/></marker></defs><style>text{font-family:monospace;fill:#f0f0f2;font-size:19px} .title{font-size:29px} .small{font-size:15px;fill:#aaaab4} .label{font-size:13px;letter-spacing:2px;fill:#aaaab4} .node{fill:#171719;stroke:#555560;stroke-width:1.5} .orange{fill:#ff9800} .violet{fill:#c4b2fb} .green{fill:#93cbb5} .edge{fill:none;stroke:#72727d;stroke-width:2;marker-end:url(#arrow)} .decision{stroke:#b7a0f0} .result{stroke:#7eb8a1}</style><rect width="960" height="520" fill="#0e0e10"/><text x="42" y="48" class="label">SUPPORT REQUESTS</text><text x="42" y="97" class="title">With AgentRun</text><text x="42" y="133" class="small">Reuse the steps. Investigate only when needed.</text><path class="edge" d="M255 238H355"/><path class="edge" d="M565 238H710"/><text class="small green" x="609" y="220">fits</text><path class="edge" d="M460 276V370"/><text class="small" x="480" y="330">needs context</text><path class="edge" d="M355 408H310V238H355" stroke-dasharray="5 5"/><text class="small" x="215" y="343">recheck</text><g id="search"><rect class="node " x="55" y="200" width="200" height="76" rx="6"/><text class="label" text-anchor="middle" x="155.0" y="226">TOOL</text><text text-anchor="middle" x="155.0" y="254">Find answer</text></g><g id="judge"><rect class="node decision" x="355" y="200" width="210" height="76" rx="6"/><text class="label" text-anchor="middle" x="460.0" y="226">JEV</text><text text-anchor="middle" x="460.0" y="254">Does it fit?</text></g><g id="answer"><rect class="node result" x="710" y="200" width="200" height="76" rx="6"/><text class="label" text-anchor="middle" x="810.0" y="226">CODE</text><text text-anchor="middle" x="810.0" y="254">Return answer</text></g><g id="agent"><rect class="node " x="355" y="370" width="210" height="76" rx="6"/><text class="label" text-anchor="middle" x="460.0" y="396">YOUR AGENT</text><text text-anchor="middle" x="460.0" y="424">Investigate</text></g><text class="small" x="42" y="488">One investigation max. Unresolved requests go to review.</text></svg>