<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Only the page's own files run or load: no inline script or style, no plugin, no <base>. A recording's pictures and
     videos may be data: URLs (an embedded gallery) or blob: URLs (a dropped folder). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'none'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run viewer</title>
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<main id="viewer"><p>Loading the viewer.</p></main>
<script src="gallery.js"></script>
<script src="viewer.js"></script>
</body>
</html>
