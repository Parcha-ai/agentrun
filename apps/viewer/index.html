<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run viewer</title>
<style>
  :root {
    --bg: #fbfaf7; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --rule: #dedbd3;
    --band-0: #cfe3d9; --band-1: #d7dcf0; --band-2: #f0e2c9; --band-3: #e6d4ec;
    --kill: #c8322a; --done: #3b7d5c; --open: #c79a2b; --failed: #c8322a; --focus: #2f5fd0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151514; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a3a19a; --rule: #3a3935;
      --band-0: #23493a; --band-1: #2c3560; --band-2: #5a4421; --band-3: #4a3058;
    }
  }
  /* A framing page may choose the theme (embed protocol): dark here whatever the system's. */
  :root[data-theme="dark"] {
    --bg: #151514; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a3a19a; --rule: #3a3935;
    --band-0: #23493a; --band-1: #2c3560; --band-2: #5a4421; --band-3: #4a3058;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #viewer { max-width: 1200px; margin: 0 auto; padding: 16px; }
  html.embed #viewer { max-width: none; margin: 0; padding: 8px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 24px 0 8px; }
  h3 { font-size: 14px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  h4 { font-size: 13px; margin: 8px 0 4px; }
  .meta { color: var(--muted); margin: 0; }
  .problems { color: var(--failed); }
  .result { display: inline-block; margin-top: 8px; }
  .counters { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
  .counter { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; min-width: 96px; }
  .counter .value { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .counter .label { font-size: 12px; color: var(--muted); }
  .counter.alarm .value { color: var(--failed); }
  .counter.observed .label::after { content: " (observed)"; }
  .counter.fact { border-style: dashed; }
  .timeline-wrap { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 8px; }
  .timeline { width: 100%; height: auto; display: block; cursor: pointer; }
  .lane-label { font-size: 12px; fill: var(--muted); }
  .lane-rule { stroke: var(--rule); }
  .band-0 { fill: var(--band-0); } .band-1 { fill: var(--band-1); } .band-2 { fill: var(--band-2); } .band-3 { fill: var(--band-3); }
  .band-label { font-size: 11px; fill: var(--ink); }
  .kill { fill: var(--kill); }
  .kill-label { font-size: 12px; fill: var(--kill); font-weight: 600; }
  .open-tick { fill: var(--muted); }
  .restore { stroke: var(--open); stroke-dasharray: 4 3; }
  .restore-label { font-size: 11px; fill: var(--open); }
  .baseline .counters { margin-top: 4px; opacity: 0.85; }
  .span.done { fill: var(--done); } .span.open { fill: var(--open); } .span.failed { fill: var(--failed); }
  .span.has-path { cursor: zoom-in; }
  .playhead { stroke: var(--focus); stroke-width: 2; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 12px 0; }
  .controls input[type=range] { flex: 1 1 240px; }
  .position { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
  button, select { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); cursor: pointer; }
  .chapters { display: flex; flex-wrap: wrap; gap: 6px; }
  .chapters button.current { border-color: var(--focus); }
  .focus { margin: 8px 0; color: var(--focus); display: flex; gap: 8px; align-items: center; }
  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 12px; overflow: auto; max-height: 520px; }
  .featured { margin: 12px 0; }
  .featured .panel { max-height: none; overflow: visible; }
  .panel ol { margin: 0; padding-left: 20px; font-size: 13px; }
  .panel li.live { color: var(--muted); }
  .has-path { cursor: zoom-in; }
  .focused { outline: 2px solid var(--focus); outline-offset: 1px; }
  .dim { opacity: 0.4; }
  .empty { color: var(--muted); }
  .turn { border-left: 3px solid var(--rule); padding: 4px 8px; margin: 6px 0; }
  .turn.assistant { border-color: var(--done); }
  .turn.error { border-color: var(--failed); }
  .turn .who { font-size: 12px; color: var(--muted); }
  .turn p { margin: 4px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .turn code { display: block; font-size: 12px; overflow-wrap: anywhere; }
  .turn img, img.blob { max-width: 100%; image-rendering: auto; border: 1px solid var(--rule); }
  .streaming { color: var(--open); }
  .has-cite { cursor: pointer; }
  .panel:has(.vz) { grid-column: 1 / -1; max-height: none; }
  .vz h5 { margin: 0 0 6px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .vz-top { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; font-size: 12px; }
  .vz-badge { padding: 2px 7px; border: 1px solid var(--rule); border-radius: 4px; color: var(--muted); }
  .vz-badge.red { border-color: var(--kill); color: var(--kill); } .vz-badge.ok { border-color: var(--done); color: var(--done); }
  .vz-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 0.8fr); gap: 14px; align-items: start; }
  @media (max-width: 900px) { .vz-grid { grid-template-columns: minmax(0, 1fr); } }
  .vz-lane { margin-bottom: 14px; }
  .vz-cells { display: flex; height: 12px; margin: 4px 0 6px; border-radius: 2px; overflow: hidden; background: var(--rule); }
  .vz-cell { flex: 1; } .vz-cell.read { background: var(--band-2); } .vz-cell.missed { background: var(--failed); }
  .vz-cell.reading { background: repeating-linear-gradient(45deg, var(--open) 0 3px, transparent 3px 6px); } .vz-cell.cited { background: var(--focus); }
  .vz-strip { display: flex; flex-wrap: wrap; gap: 4px; } .vz-strip figure { margin: 0; text-align: center; font-size: 10px; color: var(--muted); }
  .vz-frame { display: block; width: 76px; height: 48px; object-fit: cover; border: 1px solid var(--rule); border-radius: 2px; }
  .vz-nopic { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; background: var(--rule); color: var(--muted); font-size: 10px; text-align: center; }
  .vz-page { position: relative; display: inline-block; max-width: 100%; }
  .vz-scan { display: block; width: 260px; max-width: 100%; border: 1px solid var(--rule); }
  .vz-box { outline: 2px dashed var(--focus); background: rgba(47, 95, 208, 0.14); pointer-events: none; }
  .vz-said { margin: 6px 0 0; max-height: 220px; overflow: auto; font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .vz-typed > div { padding-left: 7.5em; text-indent: -7.5em; }
  .vz-account { max-height: 560px; overflow: auto; padding-right: 4px; }
  .vz-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 3px; }
  .vz-tile { position: relative; aspect-ratio: 1; overflow: hidden; border: 2px solid transparent; border-radius: 3px; }
  .vz-thumb { display: block; width: 100%; height: 100%; object-fit: cover; }
  .vz-label { position: absolute; left: 0; right: 0; bottom: 0; padding: 1px 3px; font-size: 9px; color: #fff; background: rgba(0, 0, 0, 0.55); }
  .vz-c0 .vz-label { background: #5d6a7a; } .vz-c1 .vz-label { background: #2f5c8f; } .vz-c2 .vz-label { background: #8a6f3a; } .vz-c3 .vz-label { background: #6b4f7a; } .vz-c4 .vz-label { background: #3f7a5c; }
  .vz-tile.right { border-color: var(--done); } .vz-tile.wrong { border-color: var(--failed); }
  .vz-tile.missed { border: 2px dashed var(--failed); opacity: 0.6; } .vz-tile.cited { outline: 2px solid var(--focus); outline-offset: 1px; }
  .vz-entry { margin: 0 0 8px; font-size: 13px; } .vz-entry.cited { border-left: 3px solid var(--focus); padding-left: 6px; }
  .vz-time { font: 11px ui-monospace, monospace; color: var(--open); }
  .vz-cite { display: inline-block; margin-left: 3px; padding: 0 4px; font: 10px ui-monospace, monospace; color: var(--focus); border: 1px solid var(--focus); border-radius: 3px; }
  .vz-cite.hot { background: var(--focus); color: #fff; }
  .vz-accuracy, .vz-weak { margin-top: 12px; } .vz-weak { max-height: 260px; overflow: auto; } .vz-weak p { margin: 0 0 4px; font-size: 13px; } .vz-accuracy p { margin: 0; } .vz-accuracy ul { margin: 2px 0 0; padding-left: 18px; font-size: 12px; }
  .vz-note { margin: 0 0 4px; font-size: 12px; color: var(--muted); } .vz-weak-page { margin: 4px 0; font-size: 12px; } .vz-stamp { display: flex; gap: 12px; margin-left: 10px; }
  .vz-drop { color: var(--failed); font-weight: 700; } .vz-stamp .vz-read { color: var(--muted); } .vz-stamp.exact .vz-read { color: var(--done); }
  .vz-meters { margin-bottom: 8px; font-size: 13px; }
  .vz-meter { display: flex; justify-content: space-between; gap: 8px; padding: 1px 0; } .vz-meter b { font-variant-numeric: tabular-nums; text-align: right; }
  .vz-meter.alarm b { color: var(--failed); } .vz-meter.zero b { color: var(--done); }
  .vz-receipt { margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--rule); font: 11px/1.45 ui-monospace, monospace; }
  .vz-receipt.missed h5 { color: var(--failed); }
  .vz-row { display: grid; grid-template-columns: 58px 1fr; gap: 6px; } .vz-row .k { color: var(--muted); } .vz-row span { max-height: 160px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
  .vz-flight { margin-top: 10px; font-size: 12px; color: var(--open); } .vz-flight ul { margin: 0; padding-left: 16px; }
  .frame { width: 100%; aspect-ratio: 16 / 10; background: #000; display: block; }
  .frame.gap { background: repeating-linear-gradient(45deg, var(--rule) 0 6px, transparent 6px 12px); color: var(--ink); display: flex; align-items: center; justify-content: center; }
  .frame.none { background: var(--rule); color: var(--muted); display: flex; align-items: center; justify-content: center; }
  .transport > .token { padding: 6px 8px; border-left: 3px solid var(--focus); margin-bottom: 6px; }
  .transport .why { font-size: 12px; color: var(--muted); }
  .transport h4 { margin: 10px 0 4px; font-size: 13px; }
  .tcounters { list-style: none; padding: 0; margin: 6px 0; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; }
  .tcounters .k { color: var(--muted); margin-right: 4px; }
  .transport .lanes { font-size: 12px; }
  .transport .lane { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
  .transport .lname { width: 108px; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .transport .cells { display: flex; flex: 1; height: 14px; }
  .transport .cell { flex: 1; background: transparent; border-bottom: 1px solid var(--rule); }
  .transport .cell.alive { background: var(--band-0); }
  .transport .cell.token { background: var(--focus); }
  .transport .cell.wait { background: repeating-linear-gradient(45deg, var(--rule) 0 3px, transparent 3px 6px); }
  .transport .cell.kill-box, .transport .cell.kill-process { background: var(--kill); }
  .transport .cell.kill-process { opacity: 0.55; }
  .transport .legend { font-size: 11px; color: var(--muted); margin: 2px 0; }
  .transport .flight .proof { font-size: 11px; color: var(--muted); }
  .transport .flight .proof.durable { color: var(--done); }
  .transport .flight.lost, .transport .box.killed { text-decoration: line-through; text-decoration-color: var(--kill); }
  .transport .kill .back { font-size: 12px; color: var(--muted); margin-left: 16px; }
  .transport .wait { color: var(--open); }
  .gallery { padding-left: 20px; }
  .drop { margin-top: 16px; padding: 24px; border: 2px dashed var(--rule); border-radius: 8px; color: var(--muted); }
  .panel:has(.wm) { grid-column: 1 / -1; max-height: none; }
  .wm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(26px, 1fr)); gap: 4px; max-width: 640px; margin: 8px 0; }
  .wm-glyph { display: grid; place-items: center; aspect-ratio: 1; border: 1px solid var(--rule); border-radius: 6px; font-size: 16px; line-height: 1; color: var(--muted); }
  .wm-glyph.working { color: var(--open); } .wm-glyph.done { color: var(--done); } .wm-glyph.finding { color: var(--failed); border-color: var(--failed); }
  .wm-glyph.cut { box-shadow: 0 0 0 2px var(--kill); } .wm-glyph.zoomed { outline: 2px solid var(--focus); outline-offset: 1px; }
  .wm-legend, .wm-kills { color: var(--muted); font-size: 13px; } .wm-kill { margin-left: 10px; color: var(--kill); } .wm-kill-count { font-weight: 600; color: var(--kill); }
  .wm.zoom { display: grid; grid-template-columns: minmax(240px, 1fr) 2fr; gap: 16px; align-items: start; }
  .wm-branch h4 { margin: 0 0 6px; } .wm-graph { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .wm-node { border: 1px solid var(--rule); border-radius: 6px; padding: 2px 8px; font-size: 12px; color: var(--muted); }
  .wm-node.done { color: var(--done); border-color: var(--done); } .wm-node.open, .wm-node.working { color: var(--open); border-color: var(--open); }
  .wm-evidence { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; } .wm-evidence h5 { margin: 0 0 4px; font-size: 12px; color: var(--muted); }
  .wm-evidence ul { margin: 0; padding-left: 18px; font-size: 13px; } .wm-evidence li.outside { color: var(--failed); font-weight: 600; }
  .wm-log { margin: 6px 0 0; padding: 6px; font-size: 11px; background: var(--bg); border: 1px solid var(--rule); border-radius: 4px; white-space: pre-wrap; }
  .wm-shot { max-width: 100%; border: 1px solid var(--rule); border-radius: 4px; } .wm-facts, .wm-notes { font-size: 13px; }
  .wm-ledger { grid-column: 1 / -1; } .wm-ledger table { border-collapse: collapse; } .wm-ledger th, .wm-ledger td { padding: 3px 14px 3px 0; text-align: left; font-size: 14px; }
  .wm-ledger tr.alarm td { color: var(--failed); font-weight: 600; } .wm-price { font-weight: 600; }
</style>
</head>
<body>
<main id="viewer"><p>Loading the viewer.</p></main>
<script src="gallery.js"></script>
<script src="viewer.js"></script>
</body>
</html>
